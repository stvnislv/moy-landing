# Статическая страница и серверные функции оплаты; исходники функций не публикуются как файлы сайта.
[build]
  command = "npm ci --omit=dev && mkdir -p _site && cp index.html hero-bg.jpg _site/"
  publish = "_site"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
