<!doctype html>
<!-- Telegram Mini App Stvnislv: точка входа.
     Здесь только каркас: четыре экрана и нижнее меню. Содержимое экранов
     заполняет app.js из данных в data.js. Стили — styles.css, липкие нити у кнопки с именем — sticky-arm.js. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>Stvnislv</title>
<meta name="theme-color" content="#f3f3f1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%2319191b'/%3E%3Ctext x='32' y='34' fill='%23f3f3f1' font-family='system-ui,sans-serif' font-size='34' font-weight='500' text-anchor='middle' dominant-baseline='middle'%3ES%3C/text%3E%3C/svg%3E">
<!-- SDK Telegram: данные пользователя, тема, кнопка «Назад», вибрация.
     Вне Telegram (или без интернета) приложение работает и без него. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Тема ставится до отрисовки, чтобы не мигал светлый экран в тёмном Telegram. -->
<script>
  (function () {
    var tg = window.Telegram && window.Telegram.WebApp;
    // Сначала — выбор, сделанный переключателем; если его нет — тема Telegram или системы.
    var saved = null;
    try { saved = localStorage.getItem("theme"); } catch (e) {}
    var dark = saved ? saved === "night" : tg && tg.initData ? tg.colorScheme === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    if (dark) document.documentElement.classList.add("night");
  })();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <!-- Туман за экранами: стекло размывает именно его. Ночью скрыт. -->
  <div class="backdrop" aria-hidden="true"></div>

  <!-- Переключатель дня и ночи, как в шапке сайта. Виден на всех экранах. -->
  <button type="button" class="theme-toggle" role="switch" aria-checked="false" aria-label="Ночной режим">
    <span class="knob" aria-hidden="true">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="#1d1e20" stroke-width="1.75" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="#2b2926" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </span>
  </button>

  <main class="screens">
    <!-- 1. Главная: имя-кнопка с липкими нитями (открывает чат в Telegram) и фраза о себе. -->
    <section class="screen screen-home" id="home" data-screen="home" aria-labelledby="home-title">
      <div class="home">
        <!-- Сцена — первый экран сайта в миниатюре: картинка hero-bg.jpg (чёрная щель и тень под ней)
             и слои тёплого света из щели. Положение щели считает app.js (SLIT), свет всегда точно под ней.
             Кнопка с именем стоит в этом свете. -->
        <div class="scene" data-scene>
          <div class="scene-bg" aria-hidden="true">
            <div class="scene-img"></div>
            <div class="slit-beam"></div>
            <div class="slit"></div>
            <div class="slit-light"></div>
            <div class="slit-edge"></div>
          </div>
          <p class="kicker" data-greeting></p>
          <h1 class="home-title" id="home-title">
            <button type="button" class="sab-btn name-btn" data-name-button data-sticky-arm></button>
          </h1>
        </div>
        <p class="home-role" data-role></p>
        <p class="home-phrase" data-phrase></p>
      </div>
    </section>

    <!-- 2. Услуги: три карточки с ценой и сроком. -->
    <section class="screen" id="services" data-screen="services" aria-labelledby="services-title" hidden>
      <h2 class="screen-title" id="services-title">Услуги</h2>
      <div class="cards" data-services></div>
      <p class="note" data-services-note></p>
    </section>

    <!-- 3. Портфолио: первым — сайт. -->
    <section class="screen" id="portfolio" data-screen="portfolio" aria-labelledby="portfolio-title" hidden>
      <h2 class="screen-title" id="portfolio-title">Портфолио</h2>
      <div class="cards" data-portfolio></div>
    </section>

    <!-- 4. Связаться: кнопка в Telegram, другие контакты, как идёт работа. -->
    <section class="screen" id="contact" data-screen="contact" aria-labelledby="contact-title" hidden>
      <h2 class="screen-title" id="contact-title">Связаться</h2>
      <div class="contact-panel glass">
        <h3 class="contact-heading" data-contact-title></h3>
        <p class="contact-text" data-contact-text></p>
        <button type="button" class="btn-main tap" data-telegram-button></button>
      </div>
      <ul class="list glass" data-contact-list></ul>
      <h3 class="block-title">Как я работаю</h3>
      <ol class="steps" data-steps></ol>
      <p class="footer" data-footer></p>
    </section>
  </main>

  <!-- Нижнее меню: четыре кнопки. Стеклянная подложка .tab-glow едет под активной. -->
  <nav class="tabbar" aria-label="Разделы">
    <span class="tab-glow" aria-hidden="true"></span>
    <button type="button" class="tab tap" data-tab="home" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1v-8.5Z"/></svg>
      <span>Главная</span>
    </button>
    <button type="button" class="tab tap" data-tab="services">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 4 8.5 4.5L12 13 3.5 8.5 12 4Z"/><path d="m3.5 12.5 8.5 4.5 8.5-4.5"/><path d="m3.5 16.5 8.5 4.5 8.5-4.5"/></svg>
      <span>Услуги</span>
    </button>
    <button type="button" class="tab tap" data-tab="portfolio">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="7" width="17" height="13" rx="2.5"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7"/><path d="M3.5 12.5h17"/></svg>
      <span>Портфолио</span>
    </button>
    <button type="button" class="tab tap" data-tab="contact">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.2A8 8 0 1 1 20 12Z"/></svg>
      <span>Связаться</span>
    </button>
  </nav>

  <!-- Короткое сообщение внизу экрана, например «Почта скопирована». -->
  <div class="toast" role="status" aria-live="polite"></div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script src="sticky-arm.js"></script>
</body>
</html>
