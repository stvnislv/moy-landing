      const n = neurons[hb.target];
      n.glow = 1;
      n.red = 1;
      blooms.push({ x: n.x, y: n.y, t: 0, size: 1 });
      synapses.filter((s) => s.a === hb.target || s.b === hb.target).forEach((s) =>
        pulses.push({ from: hb.target, to: s.a === hb.target ? s.b : s.a, t: 0, speed: 0.016, hops: 2, red: true }));
    }
  }
  for (let i = heartbeats.length - 1; i >= 0; i--) if (heartbeats[i].done) heartbeats.splice(i, 1);

  // Вспышки рассеянного света там, где импульс встретил нейрон.
  for (const b of blooms) {
    b.t += 0.018;
    const r = (6 + 30 * Math.sqrt(b.t)) * b.size;
    const a = (1 - b.t) ** 2;
    const g = ctx.createRadialGradient(b.x * w, b.y * h, 0, b.x * w, b.y * h, r);
    g.addColorStop(0, night ? `rgba(255, 210, 180, ${0.7 * a})` : `rgba(255, 120, 90, ${0.45 * a})`);
    g.addColorStop(0.4, night ? `rgba(255, 90, 80, ${0.35 * a})` : `rgba(240, 70, 60, ${0.22 * a})`);
    g.addColorStop(1, "rgba(255, 60, 60, 0)");
    ctx.save();
    ctx.globalCompositeOperation = night ? "lighter" : "source-over";
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(b.x * w, b.y * h, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  blooms = blooms.filter((b) => b.t < 1);

  // Импульсы по связям.
  const born = [];
  for (const p of pulses) {
    p.t = Math.min(1, p.t + p.speed);
    const a = neurons[p.from], c = neurons[p.to];
    // импульс бежит по изогнутой нити-связи: яркая капля с хвостом
    const curve = synapseCurve(p.from, p.to, time, w, h);
    const at = (tt) => {
      const u = curve.flip ? 1 - tt : tt;
      const f = Math.max(0, Math.min(1, u)) * (curve.pts.length - 1), i = Math.min(curve.pts.length - 2, Math.floor(f)), k = f - i;
      const A = curve.pts[i], B = curve.pts[i + 1];
      return [A[0] + (B[0] - A[0]) * k, A[1] + (B[1] - A[1]) * k];
    };
    const color = p.red ? "255, 90, 90" : night ? "255, 220, 170" : "235, 140, 50";
    for (let q = 0; q < 8; q++) {
      const tt = p.t - q * 0.05;
      if (tt < 0) break;
      const [qx, qy] = at(tt);
      ctx.fillStyle = `rgba(${color}, ${0.95 * (1 - q / 8)})`;
      ctx.beginPath(); ctx.arc(qx, qy, 1.7 * (1 - q / 10), 0, Math.PI * 2); ctx.fill();
    }
    if (p.t >= 1) {
      p.done = true;
      c.glow = 1;
      if (p.red) { c.red = Math.max(c.red, 0.7); blooms.push({ x: c.x, y: c.y, t: 0.2, size: 0.55 }); }
      if (p.hops > 0) {
        const next = synapses.filter((s) => (s.a === p.to || s.b === p.to) && !(s.a === p.from || s.b === p.from));
        const s = next[Math.floor(Math.random() * next.length)];
        if (s) born.push({ from: p.to, to: s.a === p.to ? s.b : s.a, t: 0, speed: p.speed, hops: p.hops - 1, red: p.red });
      }
    }
  }
  pulses = pulses.filter((p) => !p.done).concat(born);

  // Нейроны: вспыхивают от импульсов и светят ярче рядом с курсором.
  for (const n of neurons) {
    n.glow *= 0.955;
    n.red *= 0.97;
    const x = n.x * w, y = n.y * h;
    const g = Math.min(1, n.glow + nearCursor(n.x, n.y) * 0.9);
    const warm = night ? [255, 210, 150] : [240, 150, 60];
    const rgb = warm.map((v, i) => Math.round(v + ([255, 80, 80][i] - v) * n.red));
    if (g > 0.02) {
      const halo = ctx.createRadialGradient(x, y, 0, x, y, 10);
      halo.addColorStop(0, `rgba(${rgb.join(",")}, ${0.75 * g})`);
      halo.addColorStop(1, `rgba(${rgb.join(",")}, 0)`);
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(x, y, 10, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = `rgba(${rgb.join(",")}, ${0.35 + 0.65 * g})`;
    ctx.beginPath();
    ctx.arc(x, y, 1.6 + g * 1.4 + Math.sin(time / 300 + n.seed) * 0.3, 0, Math.PI * 2);   // нейрон — капля, которая чуть пульсирует
    ctx.fill();
  }
  ctx.globalCompositeOperation = "source-over";
  if (lifeVisible && moving) requestAnimationFrame(drawLife);
}

buildNeurons();
drawThreads();
drawLife(0);
new IntersectionObserver(([entry]) => {
  const was = lifeVisible;
  lifeVisible = entry.isIntersecting;
  if (lifeVisible && !was) requestAnimationFrame(drawLife);
}).observe(lifeCanvas);
// Без анимации сердце и нейроны рисуются один раз, поэтому после изменений их нужно перерисовать вручную.
function redrawStill() {
  if (calm.matches) drawLife(lastTime);
}
window.addEventListener("resize", () => { lifeCtx = fitCanvas(lifeCanvas); drawThreads(); redrawStill(); });
// Тема сменилась — перерисовать нити, сердце и нейроны своим цветом.
new MutationObserver(() => { drawThreads(); redrawStill(); })
  .observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });

// ---------------------------------------------------------------
// Щель: там, где над ней курсор, свет разгорается сильнее.
// ---------------------------------------------------------------
let slitHot = 0, slitTarget = 0, slitX = 0.5, slitRunning = false;
function animateSlit() {
  slitHot += (slitTarget - slitHot) * 0.1;
  heroBg.style.setProperty("--hot", slitHot.toFixed(3));
  heroBg.style.setProperty("--hot-x", `${(slitX * 100).toFixed(2)}%`);
  if (Math.abs(slitTarget - slitHot) > 0.002) requestAnimationFrame(animateSlit);
  else slitRunning = false;
}
heroSection.addEventListener("pointermove", (event) => {
  const rect = heroBg.getBoundingClientRect();
  const sx = parseFloat(heroBg.style.getPropertyValue("--slit-x"));
  const sw = parseFloat(heroBg.style.getPropertyValue("--slit-w"));
  const sy = parseFloat(heroBg.style.getPropertyValue("--slit-y"));
  const x = event.clientX - rect.left, y = event.clientY - rect.top;
  const along = (x - sx) / sw;
  const inside = along > -0.05 && along < 1.05 && y > sy - 60 && y < sy + 160;
  slitTarget = inside ? 1 : 0;
  if (inside) slitX = Math.min(1, Math.max(0, along));
  if (!slitRunning) { slitRunning = true; requestAnimationFrame(animateSlit); }
});
heroSection.addEventListener("pointerleave", () => {
  slitTarget = 0;
  if (!slitRunning) { slitRunning = true; requestAnimationFrame(animateSlit); }
});
</script>
<script>
/* ==========================================================
   Sticky Arm Button
   Когда курсор подходит к кнопке, из её края к нему тянутся
   липкие нити: плотный пучок по центру стороны, обращённой
   к курсору, и вялые боковые нити, которые цепляются за
   центральные и обвиваются вокруг них. Если отвести курсор,
   нити истончаются, по очереди рвутся и втягиваются в кнопку.

   Использование:
     <a class="sab-btn" data-sticky-arm href="...">Текст</a>
     + CSS из sticky-arm-button.css и этот скрипт в конце body.
   Кнопки с data-sticky-arm подключаются автоматически.
   Вручную: StickyArmButton.mount(element, { ...настройки })
   ========================================================== */
(function (global) {
  'use strict';

  // ---------- Настройки ----------
  const DEFAULTS = {
    near: 0.6,              // зона срабатывания: доля ширины кнопки от её края
    core: 13,               // нитей в центральном пучке
    side: 10,               // боковых нитей
    segs: 22,               // точек в нити
    coreWidth: [1.1, 4.4],  // толщина центральных нитей, px
    sideWidth: [0.45, 1.9], // толщина боковых, px
    coreSpread: 0.16,       // разброс центральных нитей по стороне (доля стороны)
    coreBreak: [190, 300],  // длина, на которой рвутся центральные нити, px
    sideBreak: [140, 250],  // ...боковые рвутся раньше
    leadMs: 140,            // первая нить долетает до курсора
    coreGrowMs: 150,
    coreDelayMs: [40, 220],
    sideGrowMs: 420,        // боковые тянутся медленнее
    sideDelayMs: [180, 520],
    respawnMs: 260,         // через сколько оторванная нить может прилипнуть снова
    braid: 0.32,            // как сильно боковые нити липнут к центральным
    twist: 3.2,             // радиус переплетения вокруг центральной нити, px
    gravity: 0.13,
    damping: 0.9,
    slack: 1.045,
    tremble: 0.2,
    recoil: 0.9,            // скорость втягивания оторванной нити (меньше = быстрее)
    color: '#111',
    maxArc: 0.5,            // максимальная длина стороны, откуда растут нити (доля контура в каждую сторону)
    shape: null,            // свой контур вместо капсулы: { contour(g), inside(g, x, y), clip(ctx, g) }
  };

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);
  const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
  const easeOut = t => 1 - Math.pow(1 - t, 3);

  function mount(btn, opts) {
    if (!btn || btn.__sab) return btn && btn.__sab;
    const C = Object.assign({}, DEFAULTS, opts || {});
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return (btn.__sab = { destroy() {} });

    const root = document.documentElement;
    const cv = document.createElement('canvas');
    cv.className = 'sab-canvas';
    cv.setAttribute('aria-hidden', 'true');
    document.body.append(cv);
    const ctx = cv.getContext('2d');

    let W = 0, H = 0;
    function resize() {
      // на больших экранах (iMac 5K и т. п.) ограничиваем плотность холста — меньше работы видеокарте
      let dpr = Math.min(devicePixelRatio || 1, 2);
      const px = innerWidth * innerHeight;
      if (px * dpr * dpr > 6e6) dpr = Math.max(1, Math.sqrt(6e6 / px));
      W = innerWidth; H = innerHeight;
      cv.width = W * dpr; cv.height = H * dpr;
      cv.style.width = W + 'px'; cv.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();

    const mouse = { x: -1e4, y: -1e4 };
    let touch = null, suppressClick = false;
    let drips = [], drops = [];
    let raf = 0;

    // ---------- геометрия капсулы ----------
    function geom() {
      const r = btn.getBoundingClientRect();
      return { l: r.left, t: r.top, w: r.width, h: r.height,
               x: r.left + r.width / 2, y: r.top + r.height / 2, hw: r.width / 2, hh: r.height / 2 };
    }
    // Форма может быть любой: по умолчанию капсула кнопки, но через opts.shape можно передать
    // свой контур (например, силуэт портрета): { contour(g), inside(g, x, y), clip(ctx, g) }.
    function contour(g, N) {
      if (C.shape) return C.shape.contour(g, N);
      const r = g.hh, L = Math.max(0, g.w - 2 * r), P = 2 * L + 2 * Math.PI * r, out = [];
      for (let i = 0; i < N; i++) {
        let d = (i / N) * P, x, y, nx, ny;
        if (d < L) { x = g.l + r + d; y = g.t; nx = 0; ny = -1; }
        else if ((d -= L) < Math.PI * r) { const a = -Math.PI / 2 + d / r; x = g.l + r + L + Math.cos(a) * r; y = g.y + Math.sin(a) * r; nx = Math.cos(a); ny = Math.sin(a); }
        else if ((d -= Math.PI * r) < L) { x = g.l + r + L - d; y = g.t + g.h; nx = 0; ny = 1; }
        else { d -= L; const a = Math.PI / 2 + d / r; x = g.l + r + Math.cos(a) * r; y = g.y + Math.sin(a) * r; nx = Math.cos(a); ny = Math.sin(a); }
        out.push({ x, y, nx, ny });
      }
      return out;
    }
    // Сторона кнопки, обращённая к курсору. Возвращает функцию: доля f ∈ [0..1] → точка чуть под краем.
    // Центр стороны (f = 0.5) — точка края, ближайшая к курсору.
    function facingSide(g) {
      const pts = contour(g, 180), N = pts.length;
      const face = pts.map(p => (mouse.x - p.x) * p.nx + (mouse.y - p.y) * p.ny > 0);
      let best = 0, bd = Infinity;
      pts.forEach((p, i) => { const d = Math.hypot(mouse.x - p.x, mouse.y - p.y); if (d < bd) { bd = d; best = i; } });
      let a = 0, b = 0; // сколько точек стороны слева и справа от ближайшей
      const all = face.every(Boolean) || !face.some(Boolean);
      if (all) { a = b = N / 4; }
      else {
        const lim = N * C.maxArc;   // для сложных контуров (силуэт) сторона ограничена
        while (a < lim && face[((best - a - 1) % N + N) % N]) a++;
        while (b < lim && face[(best + b + 1) % N]) b++;
        a = Math.max(a, 6); b = Math.max(b, 6);
      }
      return f => {
        const t = f < 0.5 ? best - (0.5 - f) * 2 * a * 0.96 : best + (f - 0.5) * 2 * b * 0.96;
        const i0 = Math.floor(t), k = t - i0;
        const p = pts[((i0 % N) + N) % N], q = pts[(((i0 + 1) % N) + N) % N];
        const nx = p.nx + (q.nx - p.nx) * k, ny = p.ny + (q.ny - p.ny) * k;
        return { x: p.x + (q.x - p.x) * k - nx * 3, y: p.y + (q.y - p.y) * k - ny * 3 };
      };
    }
    function edgeDist(g) {
      let bd = Infinity;
      for (const p of contour(g, 90)) bd = Math.min(bd, Math.hypot(mouse.x - p.x, mouse.y - p.y));
      const inside = C.shape ? C.shape.inside(g, mouse.x, mouse.y) : Math.abs(mouse.x - g.x) < g.hw - g.hh
        ? Math.abs(mouse.y - g.y) < g.hh
        : Math.hypot(Math.abs(mouse.x - g.x) - (g.hw - g.hh), mouse.y - g.y) < g.hh;
      return inside ? -bd : bd;
    }
    function pill(g) {
      if (C.shape) return C.shape.clip(ctx, g);
      const r = g.hh;
      ctx.moveTo(g.l + r, g.t);
      ctx.lineTo(g.l + g.w - r, g.t);
      ctx.arc(g.l + g.w - r, g.y, r, -Math.PI / 2, Math.PI / 2);
      ctx.lineTo(g.l + r, g.t + g.h);
      ctx.arc(g.l + r, g.y, r, Math.PI / 2, Math.PI * 1.5);
      ctx.closePath();
    }

    // ---------- нити ----------
    // Слоты фиксированы: 0..core-1 — центральные (0 — первая, «ведущая»), дальше боковые.
    const strands = [];
    for (let i = 0; i < C.core + C.side; i++) {
      const core = i < C.core;
      strands.push({
        core, lead: i === 0, idx: i,
        state: 'dead', diedAt: -1e9,
        pts: [], A: { x: 0, y: 0 }, tip: { x: 0, y: 0 },
      });
    }
    const cores = strands.filter(s => s.core);

    function spawn(s, now, side, first) {
      const sideRight = s.idx % 2 === 0;
      s.f = s.core
        ? (s.lead ? 0.5 : clamp(0.5 + gauss() * C.coreSpread * 1.6, 0.26, 0.74))
        : (sideRight ? rand(0.7, 0.98) : rand(0.02, 0.3));
      s.w = s.core ? rand(C.coreWidth[0], C.coreWidth[1]) : rand(C.sideWidth[0], C.sideWidth[1]);
      if (s.core && Math.random() < 0.25) s.w = rand(C.coreWidth[0], C.coreWidth[0] + 0.8); // немного тонких и в центре
      s.ox = s.lead ? 0 : rand(-5, 5); s.oy = s.lead ? 0 : rand(-5, 5);
      s.brk = s.core ? rand(C.coreBreak[0], C.coreBreak[1]) * (0.85 + s.w / 14) : rand(C.sideBreak[0], C.sideBreak[1]);
      s.born = now;
      s.delay = s.lead || !first ? (s.lead ? 0 : rand(0, 120)) : s.core ? rand(C.coreDelayMs[0], C.coreDelayMs[1]) : rand(C.sideDelayMs[0], C.sideDelayMs[1]);
      s.dur = s.lead ? C.leadMs : s.core ? C.coreGrowMs : C.sideGrowMs;
      s.seed = rand(0, 1000);
      s.merge = Math.floor(C.segs * rand(0.3, 0.55));   // где боковая нить прилипает к центральной
      s.phase = rand(0, Math.PI * 2); s.freq = rand(0.55, 0.95); s.spin = rand(-1, 1) < 0 ? -1 : 1;
      // фактура: неровная толщина по длине
      s.prof = []; const ph1 = rand(0, 6), ph2 = rand(0, 6), f1 = rand(0.5, 0.9), f2 = rand(1.3, 2.2);
      for (let j = 0; j <= C.segs; j++) s.prof.push(1 + 0.22 * Math.sin(j * f1 + ph1) + 0.14 * Math.sin(j * f2 + ph2));
      s.bead = s.w > 2 && Math.random() < 0.55 ? { t: rand(0.25, 0.75), r: rand(0.55, 0.85) } : null;
      const a = side(s.f);
      s.A.x = a.x; s.A.y = a.y; s.tip.x = a.x; s.tip.y = a.y;
      s.pts = [];
      for (let j = 0; j <= C.segs; j++) s.pts.push({ x: a.x, y: a.y, px: a.x, py: a.y });
      s.rest = 0; s.tension = 0;
      // не даём нити сразу порваться, если курсор уже далеко от её края
      const D0 = Math.hypot(mouse.x - a.x, mouse.y - a.y);
      s.brk = Math.max(s.brk, D0 * (s.core ? 1.8 : 1.5));
      s.state = 'grow';
    }

    function detach(s, now) {
      if (s.state !== 'grow' && s.state !== 'live') return;
      s.state = 'recoil';
      s.anchor = { x: s.A.x, y: s.A.y };
      const last = s.pts.length - 1;
      s.rest = Math.hypot(s.pts[last].x - s.pts[0].x, s.pts[last].y - s.pts[0].y) / C.segs;
      // упругая отдача: свободная часть получает скорость к кнопке
      for (let j = 1; j <= last; j++) {
        const p = s.pts[j], k = (j / last) * 0.1;
        p.px = p.x - (s.anchor.x - p.x) * k;
        p.py = p.y - (s.anchor.y - p.y) * k;
      }
      // на курсоре остаётся капля, она падает и исчезает
      if (s.tension > 0.6) drops.push({ x: s.pts[last].x, y: s.pts[last].y, vx: 0, vy: 0.5, r: Math.max(0.8, s.w * 0.6), born: now });
      // боковые нити, прилипшие к этой, тоже отрываются
      if (s.core) for (const o of strands) if (!o.core && o.host === s) detach(o, now);
    }
    function releaseAll(now) { for (const s of strands) detach(s, now); if (strands.some(s => s.state === 'recoil')) wake(); }

    // ---------- физика (верле) ----------
    function integrate(pts, pinA, pinB) {
      const last = pts.length - 1;
      for (let i = 0; i <= last; i++) {
        if ((i === 0 && pinA) || (i === last && pinB)) continue;
        const p = pts[i];
        const vx = (p.x - p.px) * C.damping, vy = (p.y - p.py) * C.damping;
        p.px = p.x; p.py = p.y;
        p.x += vx; p.y += vy + C.gravity;
      }
    }
    function constrain(pts, rest, A, B, iters) {
      const last = pts.length - 1;
      for (let it = 0; it < iters; it++) {
        if (A) { pts[0].x = A.x; pts[0].y = A.y; }
        if (B) { pts[last].x = B.x; pts[last].y = B.y; }
        for (let i = 0; i < last; i++) {
          const p = pts[i], q = pts[i + 1];
          const dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy) || 1e-4;
          const diff = (d - rest) / d;
          const fp = i === 0 && A, fq = i + 1 === last && B;
          const wp = fp ? 0 : (fq ? 1 : 0.5), wq = fq ? 0 : (fp ? 1 : 0.5);
          p.x += dx * diff * wp; p.y += dy * diff * wp;
          q.x -= dx * diff * wq; q.y -= dy * diff * wq;
        }
      }
      if (A) { pts[0].px = pts[0].x = A.x; pts[0].py = pts[0].y = A.y; }
      if (B) { pts[last].px = pts[last].x = B.x; pts[last].py = pts[last].y = B.y; }
    }
    function tremble(s, now, amp) {
      const a = s.pts[0], b = s.pts[C.segs];
      let nx = -(b.y - a.y), ny = b.x - a.x;
      const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
      for (let j = 1; j < C.segs; j++) {
        const env = Math.sin(Math.PI * j / C.segs);
        const n = Math.sin(now * 0.011 + s.seed + j * 0.8) * 0.6 + Math.sin(now * 0.027 + s.seed * 1.3 + j * 1.7) * 0.4;
        s.pts[j].x += nx * n * amp * env;
        s.pts[j].y += ny * n * amp * env;
      }
    }
    // Боковая нить после точки прилипания тянется к центральной и обвивается вокруг неё спиралью
    function braid(s, now) {
      const h = s.host.pts, last = C.segs;
      for (let j = s.merge; j < last; j++) {
        const hp = h[j], hq = h[Math.min(j + 1, last)];
        let tx = hq.x - hp.x, ty = hq.y - hp.y; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
        const fade = 1 - (j - s.merge) / (last - s.merge) * 0.7;          // ближе к курсору виток плотнее
        const ang = j * s.freq * 2.2 + s.phase + now * 0.002 * s.spin;
        const off = Math.sin(ang) * C.twist * fade;
        const gx = hp.x - ty * off, gy = hp.y + tx * off;
        const k = C.braid * clamp((j - s.merge + 1) / 3, 0, 1);           // мягкий вход в переплетение
        s.pts[j].x += (gx - s.pts[j].x) * k;
        s.pts[j].y += (gy - s.pts[j].y) * k;
      }
    }

    // ---------- отрисовка: лента переменной толщины + блик ----------
    function ribbon(pts, widthAt) {
      const n = pts.length, L = [], R = [];
      for (let i = 0; i < n; i++) {
        const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
        let tx = b.x - a.x, ty = b.y - a.y; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
        const hw = widthAt(i) / 2;
        L.push({ x: pts[i].x - ty * hw, y: pts[i].y + tx * hw });
        R.push({ x: pts[i].x + ty * hw, y: pts[i].y - tx * hw });
      }
      ctx.beginPath();
      ctx.moveTo(L[0].x, L[0].y);
      for (let i = 1; i < n - 1; i++) ctx.quadraticCurveTo(L[i].x, L[i].y, (L[i].x + L[i + 1].x) / 2, (L[i].y + L[i + 1].y) / 2);
      ctx.lineTo(L[n - 1].x, L[n - 1].y);
      ctx.lineTo(R[n - 1].x, R[n - 1].y);
      for (let i = n - 2; i > 0; i--) ctx.quadraticCurveTo(R[i].x, R[i].y, (R[i].x + R[i - 1].x) / 2, (R[i].y + R[i - 1].y) / 2);
      ctx.lineTo(R[0].x, R[0].y);
      ctx.closePath();
      ctx.fill();
      // скруглённые концы
      for (const i of [0, n - 1]) { ctx.beginPath(); ctx.arc(pts[i].x, pts[i].y, widthAt(i) / 2, 0, Math.PI * 2); ctx.fill(); }
      return { L, R };
    }
    function curve(pts, from, to) {
      ctx.beginPath();
      ctx.moveTo(pts[from].x, pts[from].y);
      for (let i = from + 1; i < to; i++) ctx.quadraticCurveTo(pts[i].x, pts[i].y, (pts[i].x + pts[i + 1].x) / 2, (pts[i].y + pts[i + 1].y) / 2);
      ctx.lineTo(pts[to].x, pts[to].y);
    }
    function pointAt(pts, t) {
      const f = t * (pts.length - 1), i = Math.min(pts.length - 2, Math.floor(f)), k = f - i;
      return { x: pts[i].x + (pts[i + 1].x - pts[i].x) * k, y: pts[i].y + (pts[i + 1].y - pts[i].y) * k };
    }
    function drawStrand(s, col, hl) {
      const n = s.pts.length - 1;
      const t = s.tension;
      const neck = clamp((t - 0.72) / 0.28, 0, 1);              // перед разрывом нить «вытягивается» и истончается
      const recoil = s.state === 'recoil';
      const widthAt = i => {
        const u = i / n;
        let k = s.prof[Math.min(i, s.prof.length - 1)];
        k *= 1.25 - 0.55 * Math.sin(Math.PI * u) * (0.6 + 0.6 * t); // толще у концов, тоньше в середине при натяжении
        if (!recoil && neck > 0) k *= 1 - 0.75 * neck * clamp((u - 0.55) / 0.45, 0, 1);
        return Math.max(0.35, s.w * k);
      };
      ctx.fillStyle = col;
      ribbon(s.pts, widthAt);
      // глянцевый блик на толстых нитях
      if (s.w > 1.5) {
        ctx.save();
        ctx.strokeStyle = hl;
        ctx.lineWidth = Math.max(0.5, s.w * 0.2);
        ctx.translate(-s.w * 0.18, -s.w * 0.22);
        curve(s.pts, 1, n - 1);
        ctx.stroke();
        ctx.restore();
      }
      // капля-бусина на нити
      if (s.bead && !recoil) {
        const p = pointAt(s.pts, s.bead.t);
        const r = s.w * s.bead.r * (1 - 0.4 * t) + 0.6;
        ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = hl;
        ctx.beginPath(); ctx.arc(p.x - r * 0.35, p.y - r * 0.4, r * 0.32, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = col;
      }
      // при отдаче на свободном конце — капля
      if (recoil) {
        const e = s.pts[n];
        ctx.beginPath(); ctx.arc(e.x, e.y, s.w * 0.75 + 0.5, 0, Math.PI * 2); ctx.fill();
      }
    }

    // ---------- кадр ----------
    // Анимация работает только пока есть что рисовать. В покое цикл полностью остановлен,
    // а будит его движение курсора рядом с кнопкой — так страница не нагружает процессор.
    let prev = performance.now(), running = false;
    function wake() {
      if (running) return;
      running = true; prev = performance.now();
      raf = requestAnimationFrame(frame);
    }
    function frame(now) {
      const dt = Math.min(50, now - prev); prev = now;
      const g = geom();
      const de = edgeDist(g);
      const near = C.near * g.w;
      const side = facingSide(g);

      // курсор рядом — прилипают все свободные нити (ведущая первой)
      const anyAlive = strands.some(s => s.state !== 'dead');
      if (de < near && mouse.x > -1e3) {
        const first = !anyAlive;
        for (const s of strands) {
          if (s.state !== 'dead' || now - s.diedAt < C.respawnMs) continue;
          if (!s.core) {
            const live = cores.filter(c => c.state === 'grow' || c.state === 'live');
            if (!live.length) continue;
            // боковая цепляется за одну из центральных — чаще за ближайшую к её стороне
            s.host = live[Math.floor(Math.random() * live.length)];
          }
          if (!first && s.lead) { spawn(s, now, side, false); continue; }
          spawn(s, now, side, first);
        }
      }

      ctx.clearRect(0, 0, W, H);
      const busy = strands.some(s => s.state !== 'dead') || drips.length || drops.length;
      // всё втянулось и курсор далеко — засыпаем
      if (!busy && !(de < near * 1.5 && mouse.x > -1e3)) { running = false; return; }
      raf = requestAnimationFrame(frame);
      if (!busy) return;

      const col = getComputedStyle(btn).getPropertyValue('--sab-strand').trim() || C.color;
      const hl = getComputedStyle(btn).getPropertyValue('--sab-strand-hl').trim() || 'rgba(255,255,255,.3)';
      ctx.save();
      ctx.beginPath(); ctx.rect(0, 0, W, H); pill(g); ctx.clip('evenodd');   // под кнопкой нитей не видно

      // 1) центральные, 2) боковые (им нужна уже посчитанная центральная)
      for (const pass of [true, false]) for (const s of strands) {
        if (s.core !== pass || s.state === 'dead') continue;

        if (s.state === 'recoil') {
          // оторвалась: держится только за кнопку, укорачивается и пружинит обратно
          s.rest *= C.recoil;
          integrate(s.pts, true, false);
          constrain(s.pts, s.rest, s.anchor, null, 8);
          s.tension = 0;
          if (s.rest < 0.35) {
            s.state = 'dead'; s.diedAt = now;
            if (s.anchor.y > g.y + g.hh * 0.25 && Math.random() < 0.5)
              drips.push({ x: s.anchor.x - g.l, y: s.anchor.y - g.t, born: now, max: rand(7, 20), w: Math.max(0.9, s.w * 0.7), seed: rand(0, 100) });
            continue;
          }
          drawStrand(s, col, hl);
          continue;
        }

        // место выхода плавно скользит по стороне, обращённой к курсору
        const tA = side(s.f);
        s.A.x += (tA.x - s.A.x) * 0.22; s.A.y += (tA.y - s.A.y) * 0.22;
        const goal = { x: mouse.x + s.ox, y: mouse.y + s.oy };

        // рост: центральные летят прямо к курсору, боковые — сначала к центральной нити, потом вдоль неё
        const k = easeOut(clamp((now - s.born - s.delay) / s.dur, 0, 1));
        if (k <= 0) { s.tip.x = s.A.x; s.tip.y = s.A.y; continue; }
        if (s.core) {
          const wig = s.lead && k < 1 ? Math.sin(k * 14 + s.seed) * 6 * (1 - k) : 0;
          const dx = goal.x - s.A.x, dy = goal.y - s.A.y, dl = Math.hypot(dx, dy) || 1;
          s.tip.x = s.A.x + dx * k - dy / dl * wig;
          s.tip.y = s.A.y + dy * k + dx / dl * wig;
        } else {
          const hm = s.host.pts[s.merge];
          if (k < 0.45) { const q = k / 0.45; s.tip.x = s.A.x + (hm.x - s.A.x) * q; s.tip.y = s.A.y + (hm.y - s.A.y) * q; }
          else { const p = pointAt(s.host.pts, s.merge / C.segs + (1 - s.merge / C.segs) * (k - 0.45) / 0.55); s.tip.x = p.x; s.tip.y = p.y; }
          if (k >= 1) { s.tip.x = goal.x; s.tip.y = goal.y; }
        }
        if (k >= 1) s.state = 'live';

        const D = Math.hypot(s.tip.x - s.A.x, s.tip.y - s.A.y);
        // натяжение по реальной длине до курсора
        s.tension = s.state === 'live' ? Math.hypot(goal.x - s.A.x, goal.y - s.A.y) / s.brk : 0;
        if (s.tension > 1) { detach(s, now); drawStrand(s, col, hl); continue; }

        integrate(s.pts, true, true);
        if (!s.core && s.state === 'live') braid(s, now);
        constrain(s.pts, Math.max(0.01, D / C.segs * C.slack), s.A, s.tip, 10);
        tremble(s, now, C.tremble * (s.core ? 1 : 0.6));
        drawStrand(s, col, hl);
      }

      // подтёки на кромке — следы втянувшихся нитей
      drips = drips.filter(d => {
        const t = now - d.born;
        if (t > 1700) return false;
        const L = t < 300 ? easeOut(t / 300) : t < 1000 ? 1 : 1 - Math.pow(clamp((t - 1000) / 700, 0, 1), 2);
        const ex = g.l + d.x, ey = g.t + d.y;
        const len = d.max * L, sway = Math.sin(now * 0.004 + d.seed) * 1.4 * L;
        ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.ellipse(ex, ey, d.w * 2.2, d.w * 1.3 + 1, 0, 0, Math.PI * 2); ctx.fill();
        ctx.lineWidth = d.w;
        ctx.beginPath(); ctx.moveTo(ex, ey); ctx.quadraticCurveTo(ex + sway * 0.3, ey + len * 0.6, ex + sway, ey + len); ctx.stroke();
        ctx.beginPath(); ctx.arc(ex + sway, ey + len, d.w * 0.9 + 0.5, 0, Math.PI * 2); ctx.fill();
        return true;
      });
      // капли, оставшиеся на курсоре после разрыва
      drops = drops.filter(d => {
        const t = now - d.born;
        if (t > 650) return false;
        d.vy += 0.25 * dt / 16; d.x += d.vx; d.y += d.vy * dt / 16;
        ctx.globalAlpha = 1 - t / 650;
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(d.x, d.y, d.r * (1 - t / 900), 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
        return true;
      });
      ctx.restore();
    }

    // ---------- события ----------
    function nearButton(x, y) {
      const r = btn.getBoundingClientRect(), pad = r.width * C.near * 1.5;
      return x > r.left - pad && x < r.right + pad && y > r.top - pad && y < r.bottom + pad;
    }
    const onMove = e => {
      if (e.pointerType === 'mouse') {
        mouse.x = e.clientX; mouse.y = e.clientY;
        if (!running && nearButton(mouse.x, mouse.y)) wake();
      }
      else if (touch && e.pointerId === touch.id) {
        mouse.x = e.clientX; mouse.y = e.clientY;
        if (Math.hypot(e.clientX - touch.x0, e.clientY - touch.y0) > 10) touch.moved = true;
      }
    };
    // Телефон: касание кнопки выпускает нити, они тянутся за пальцем; отпустил — отрываются.
    // Короткий тап открывает ссылку, перетаскивание — нет.
    const onDown = e => {
      if (e.pointerType === 'mouse') return;
      touch = { id: e.pointerId, x0: e.clientX, y0: e.clientY, moved: false };
      suppressClick = false;
      mouse.x = e.clientX; mouse.y = e.clientY;
      wake();
    };
    const onUp = e => {
      if (!touch || e.pointerId !== touch.id) return;
      suppressClick = touch.moved;
      touch = null;
      releaseAll(performance.now());
      mouse.x = mouse.y = -1e4;
    };
    const onClick = e => { if (suppressClick) { e.preventDefault(); e.stopPropagation(); suppressClick = false; } };
    const onMenu = e => { if (touch) e.preventDefault(); };
    const onLeave = () => { releaseAll(performance.now()); mouse.x = mouse.y = -1e4; };
    const onBlur = () => releaseAll(performance.now());
    addEventListener('pointermove', onMove, { passive: true });
    btn.addEventListener('pointerdown', onDown);
    addEventListener('pointerup', onUp);
    addEventListener('pointercancel', onUp);
    btn.addEventListener('click', onClick, true);
    btn.addEventListener('contextmenu', onMenu);
    root.addEventListener('mouseleave', onLeave);
    addEventListener('blur', onBlur);
    addEventListener('resize', resize);

    return (btn.__sab = {
      destroy() {
        cancelAnimationFrame(raf); running = false;
        removeEventListener('pointermove', onMove);
        btn.removeEventListener('pointerdown', onDown);
        removeEventListener('pointerup', onUp);
        removeEventListener('pointercancel', onUp);
        btn.removeEventListener('click', onClick, true);
        btn.removeEventListener('contextmenu', onMenu);
        root.removeEventListener('mouseleave', onLeave);
        removeEventListener('blur', onBlur);
        removeEventListener('resize', resize);
        cv.remove();
        delete btn.__sab;
      },
    });
  }

  function auto() { document.querySelectorAll('[data-sticky-arm]').forEach(b => mount(b)); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', auto);
  else auto();

  global.StickyArmButton = { mount, defaults: DEFAULTS };
})(window);

</script>
<script>
// ===== Портрет: к курсору тянутся сосуды от сердца и волокна от нейронов =====
// Когда курсор рядом с портретом, из сердца к нему выстреливают красные «сосуды» (в такт удару),
// из нейронов в голове — тонкие янтарные волокна. По ним к курсору бегут импульсы:
// красные — на каждый удар сердца, янтарные — когда вспыхивает нейрон.
// Если отвести курсор, нити истончаются, рвутся по очереди и втягиваются обратно.
// Использует данные и состояние портрета: PORTRAIT, neurons, lastBeat, BEAT, isNight, calm.
(function () {
  const fig = document.querySelector(".portrait");
  const life = document.querySelector(".neurons");
  if (!fig || !life || typeof PORTRAIT === "undefined" || calm.matches) return;

  const CFG = {
    pad: 150,                 // на каком расстоянии от портрета нити начинают тянуться, px
    heart: 9, nerve: 11,      // сколько сосудов и волокон
    segs: 20,
    heartWidth: [0.7, 2.6], nerveWidth: [0.35, 1.3],
    heartBreak: [300, 440], nerveBreak: [220, 340],
    grow: 170, nerveDelay: [60, 420],
    gravity: 0.1, damping: 0.9, slack: 1.05, recoil: 0.9,
    respawn: 350,
    impulseMs: 520,           // сколько импульс бежит от начала нити до курсора
  };
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const easeOut = (t) => 1 - Math.pow(1 - t, 3);

  const cv = document.createElement("canvas");
  cv.setAttribute("aria-hidden", "true");
  cv.style.cssText = "position:fixed;inset:0;pointer-events:none;z-index:2147482997";
  document.body.append(cv);
  const ctx = cv.getContext("2d");
  let W = 0, H = 0;
  function resize() {
    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    const px = innerWidth * innerHeight;
    if (px * dpr * dpr > 6e6) dpr = Math.max(1, Math.sqrt(6e6 / px));
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + "px"; cv.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  addEventListener("resize", resize);

  const mouse = { x: -1e4, y: -1e4 };
  const strands = [];
  for (let i = 0; i < CFG.heart + CFG.nerve; i++)
    strands.push({ heart: i < CFG.heart, state: "dead", diedAt: -1e9, pts: [], tip: { x: 0, y: 0 }, A: { x: 0, y: 0 } });
  let impulses = [], flashes = [];
  let seenBeat = 0, nextNerveFire = 0;

  // где сейчас сердце и нейрон на экране
  function lifeRect() { return life.getBoundingClientRect(); }
  function heartAt(r, s) {
    const [hx, hy] = PORTRAIT.heart;
    return { x: r.left + hx * r.width + s.jx, y: r.top + hy * r.height + s.jy };
  }
  function neuronAt(r, s) {
    const n = neurons[s.neuron] || neurons[0];
    return { x: r.left + n.x * r.width, y: r.top + n.y * r.height };
  }
  const anchorOf = (r, s) => (s.heart ? heartAt(r, s) : neuronAt(r, s));

  function spawn(s, now, r, burst) {
    s.w = s.heart ? rand(CFG.heartWidth[0], CFG.heartWidth[1]) : rand(CFG.nerveWidth[0], CFG.nerveWidth[1]);
    s.jx = rand(-10, 10) * r.width / 360; s.jy = rand(-12, 8) * r.width / 360;
    if (!s.heart) {
      const used = new Set(strands.filter((o) => !o.heart && o !== s && o.state !== "dead").map((o) => o.neuron));
      const free = neurons.map((_, i) => i).filter((i) => !used.has(i));
      s.neuron = free.length ? free[Math.floor(Math.random() * free.length)] : Math.floor(Math.random() * neurons.length);
    }
    s.ox = rand(-4, 4); s.oy = rand(-4, 4);
    s.brk = s.heart ? rand(CFG.heartBreak[0], CFG.heartBreak[1]) * (0.85 + s.w / 12) : rand(CFG.nerveBreak[0], CFG.nerveBreak[1]);
    s.born = now;
    s.delay = s.heart ? (burst ? rand(0, 60) : rand(0, 160)) : rand(CFG.nerveDelay[0], CFG.nerveDelay[1]);
    s.seed = rand(0, 1000);
    s.prof = []; const p1 = rand(0, 6), p2 = rand(0, 6), f1 = rand(0.5, 0.9), f2 = rand(1.3, 2.2);
    for (let j = 0; j <= CFG.segs; j++) s.prof.push(1 + 0.22 * Math.sin(j * f1 + p1) + 0.14 * Math.sin(j * f2 + p2));
    const a = anchorOf(r, s);
    s.A = a; s.tip = { x: a.x, y: a.y };
    s.pts = [];
    for (let j = 0; j <= CFG.segs; j++) s.pts.push({ x: a.x, y: a.y, px: a.x, py: a.y });
    s.tension = 0;
    const D0 = Math.hypot(mouse.x - a.x, mouse.y - a.y);
    s.brk = Math.max(s.brk, D0 * 1.6);
    s.state = "grow";
  }
  function detach(s, now) {
    if (s.state !== "grow" && s.state !== "live") return;
    s.state = "recoil";
    const last = CFG.segs;
    s.rest = Math.hypot(s.pts[last].x - s.pts[0].x, s.pts[last].y - s.pts[0].y) / CFG.segs;
    for (let j = 1; j <= last; j++) {
      const p = s.pts[j], k = (j / last) * 0.1;
      p.px = p.x - (s.A.x - p.x) * k; p.py = p.y - (s.A.y - p.y) * k;
    }
    impulses = impulses.filter((im) => im.s !== s);
  }

  function integrate(pts, pinB) {
    const last = pts.length - 1;
    for (let i = 1; i <= last; i++) {
      if (i === last && pinB) continue;
      const p = pts[i];
      const vx = (p.x - p.px) * CFG.damping, vy = (p.y - p.py) * CFG.damping;
      p.px = p.x; p.py = p.y; p.x += vx; p.y += vy + CFG.gravity;
    }
  }
  function constrain(pts, rest, A, B) {
    const last = pts.length - 1;
    for (let it = 0; it < 10; it++) {
      pts[0].x = A.x; pts[0].y = A.y;
      if (B) { pts[last].x = B.x; pts[last].y = B.y; }
      for (let i = 0; i < last; i++) {
        const p = pts[i], q = pts[i + 1];
        const dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy) || 1e-4, diff = (d - rest) / d;
        const fq = i + 1 === last && B;
        const wp = i === 0 ? 0 : (fq ? 1 : 0.5), wq = fq ? 0 : (i === 0 ? 1 : 0.5);
        p.x += dx * diff * wp; p.y += dy * diff * wp; q.x -= dx * diff * wq; q.y -= dy * diff * wq;
      }
    }
    pts[0].px = pts[0].x; pts[0].py = pts[0].y;
    if (B) { pts[last].px = pts[last].x; pts[last].py = pts[last].y; }
  }
  function pointAt(pts, t) {
    const f = clamp(t, 0, 1) * (pts.length - 1), i = Math.min(pts.length - 2, Math.floor(f)), k = f - i;
    return { x: pts[i].x + (pts[i + 1].x - pts[i].x) * k, y: pts[i].y + (pts[i + 1].y - pts[i].y) * k };
  }
  function ribbon(pts, widthAt) {
    const n = pts.length, L = [], R = [];
    for (let i = 0; i < n; i++) {
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
      let tx = b.x - a.x, ty = b.y - a.y; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
      const hw = widthAt(i) / 2;
      L.push({ x: pts[i].x - ty * hw, y: pts[i].y + tx * hw });
      R.push({ x: pts[i].x + ty * hw, y: pts[i].y - tx * hw });
    }
    ctx.beginPath();
    ctx.moveTo(L[0].x, L[0].y);
    for (let i = 1; i < n - 1; i++) ctx.quadraticCurveTo(L[i].x, L[i].y, (L[i].x + L[i + 1].x) / 2, (L[i].y + L[i + 1].y) / 2);
    ctx.lineTo(L[n - 1].x, L[n - 1].y); ctx.lineTo(R[n - 1].x, R[n - 1].y);
    for (let i = n - 2; i > 0; i--) ctx.quadraticCurveTo(R[i].x, R[i].y, (R[i].x + R[i - 1].x) / 2, (R[i].y + R[i - 1].y) / 2);
    ctx.lineTo(R[0].x, R[0].y);
    ctx.closePath(); ctx.fill();
  }

  // цвета: сосуды — красные, волокна — янтарные, как нейроны
  function colors(night) {
    return night
      ? { heart: [255, 92, 104], nerve: [255, 200, 140], hiH: [255, 230, 230], hiN: [255, 240, 210] }
      : { heart: [200, 34, 52], nerve: [214, 130, 60], hiH: [255, 120, 130], hiN: [255, 190, 120] };
  }

  let running = false, raf = 0;
  function wake() { if (!running) { running = true; raf = requestAnimationFrame(frame); } }
  function near(r) {
    return mouse.x > r.left - CFG.pad && mouse.x < r.right + CFG.pad && mouse.y > r.top - CFG.pad && mouse.y < r.bottom + CFG.pad;
  }

  function frame(now) {
    const r = lifeRect();
    const night = isNight();
    const col = colors(night);
    const inZone = near(r) && neurons.length;
    const beatNow = typeof lastBeat === "number" ? lastBeat : 0;
    const beatPhase = clamp((now - beatNow) / (typeof BEAT === "number" ? BEAT : 1000), 0, 1);
    const beatK = Math.exp(-Math.pow((beatPhase - 0.06) / 0.07, 2)) + 0.6 * Math.exp(-Math.pow((beatPhase - 0.26) / 0.07, 2));
    const newBeat = beatNow !== seenBeat; seenBeat = beatNow;

    // прилипание: сосуды — с ударом сердца, волокна — сразу, вразнобой
    if (inZone) {
      for (const s of strands) {
        if (s.state !== "dead" || now - s.diedAt < CFG.respawn) continue;
        if (s.heart && !newBeat) continue;   // сосуды выстреливают только на удар сердца
        spawn(s, now, r, newBeat);
      }
    }
    // импульсы: красные на каждый удар по всем живым сосудам, янтарные — от случайного нейрона
    if (newBeat) for (const s of strands) if (s.heart && s.state === "live") impulses.push({ s, t0: now + rand(0, 70), red: true });
    if (now > nextNerveFire) {
      nextNerveFire = now + rand(260, 640);
      const live = strands.filter((s) => !s.heart && s.state === "live");
      if (live.length) {
        const s = live[Math.floor(Math.random() * live.length)];
        impulses.push({ s, t0: now, red: false });
        const n = neurons[s.neuron]; if (n) n.glow = 1;
      }
    }

    ctx.clearRect(0, 0, W, H);
    const busy = strands.some((s) => s.state !== "dead") || flashes.length;
    if (!busy && !inZone) { running = false; return; }
    raf = requestAnimationFrame(frame);
    if (!busy) return;

    ctx.lineCap = "round";
    for (const s of strands) {
      if (s.state === "dead") continue;
      const c = s.heart ? col.heart : col.nerve;
      if (s.state === "recoil") {
        s.rest *= CFG.recoil;
        s.A = anchorOf(r, s);
        integrate(s.pts, false);
        constrain(s.pts, s.rest, s.A, null);
        if (s.rest < 0.35) { s.state = "dead"; s.diedAt = now; continue; }
        ctx.fillStyle = `rgb(${c})`;
        ribbon(s.pts, (i) => Math.max(0.3, s.w * s.prof[i] * 0.8));
        const e = s.pts[CFG.segs];
        ctx.beginPath(); ctx.arc(e.x, e.y, s.w * 0.7 + 0.4, 0, Math.PI * 2); ctx.fill();
        continue;
      }
      s.A = anchorOf(r, s);
      const goal = { x: mouse.x + s.ox, y: mouse.y + s.oy };
      const k = easeOut(clamp((now - s.born - s.delay) / CFG.grow, 0, 1));
      if (k <= 0) continue;
      // во время роста кончик извивается — живая «пуля»
      const dx = goal.x - s.A.x, dy = goal.y - s.A.y, dl = Math.hypot(dx, dy) || 1;
      const wig = k < 1 ? Math.sin(k * 12 + s.seed) * 7 * (1 - k) : 0;
      s.tip.x = s.A.x + dx * k - (dy / dl) * wig;
      s.tip.y = s.A.y + dy * k + (dx / dl) * wig;
      if (k >= 1) s.state = "live";
      s.tension = s.state === "live" ? dl / s.brk : 0;
      if (s.tension > 1) { detach(s, now); continue; }
      const D = Math.hypot(s.tip.x - s.A.x, s.tip.y - s.A.y);
      integrate(s.pts, true);
      constrain(s.pts, Math.max(0.01, (D / CFG.segs) * CFG.slack), s.A, s.tip);
      // сосуды чуть вздуваются на ударе
      const swell = s.heart ? 1 + beatK * 0.35 : 1;
      const neck = clamp((s.tension - 0.72) / 0.28, 0, 1);
      ctx.fillStyle = `rgba(${c}, ${s.heart ? 0.92 : 0.85})`;
      ribbon(s.pts, (i) => {
        const u = i / CFG.segs;
        let m = s.prof[i] * (1.2 - 0.5 * Math.sin(Math.PI * u) * (0.6 + 0.6 * s.tension)) * swell;
        if (neck > 0) m *= 1 - 0.75 * neck * clamp((u - 0.55) / 0.45, 0, 1);
        return Math.max(0.3, s.w * m);
      });
    }

    // бегущие импульсы: светящаяся точка с хвостом вдоль нити
    ctx.save();
    ctx.globalCompositeOperation = night ? "lighter" : "source-over";
    impulses = impulses.filter((im) => {
      if (im.s.state === "dead" || im.s.state === "recoil") return false;
      const t = (now - im.t0) / CFG.impulseMs;
      if (t < 0) return true;
      if (t >= 1) {
        flashes.push({ x: mouse.x, y: mouse.y, born: now, red: im.red });
        return false;
      }
      const c = im.red ? col.hiH : col.hiN, base = im.red ? col.heart : col.nerve;
      ctx.shadowColor = `rgba(${base}, 0.9)`;
      ctx.shadowBlur = 8;
      for (let i = 0; i < 7; i++) {
        const tt = t - i * 0.025;
        if (tt < 0) break;
        const p = pointAt(im.s.pts, tt);
        ctx.fillStyle = `rgba(${i ? base : c}, ${1 - i / 7})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, (im.red ? 2.6 : 1.9) * (1 - i / 9), 0, Math.PI * 2); ctx.fill();
      }
      return true;
    });
    // вспышка у курсора, когда импульс добегает
    ctx.shadowBlur = 0;
    flashes = flashes.filter((f) => {
      const t = (now - f.born) / 420;
      if (t >= 1) return false;
      const base = f.red ? col.heart : col.nerve, rad = 6 + t * 14;
      const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, rad);
      g.addColorStop(0, `rgba(${f.red ? col.hiH : col.hiN}, ${0.85 * (1 - t)})`);
      g.addColorStop(1, `rgba(${base}, 0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(f.x, f.y, rad, 0, Math.PI * 2); ctx.fill();
      return true;
    });
    ctx.restore();
  }

  function releaseAll() {
    const now = performance.now();
    for (const s of strands) detach(s, now);
    if (strands.some((s) => s.state === "recoil")) wake();
  }
  addEventListener("pointermove", (e) => {
    if (e.pointerType !== "mouse") return;
    mouse.x = e.clientX; mouse.y = e.clientY;
    if (!running && near(lifeRect())) wake();
  }, { passive: true });
  document.documentElement.addEventListener("mouseleave", () => { releaseAll(); mouse.x = mouse.y = -1e4; });
  addEventListener("blur", releaseAll);
  // на телефоне: коснулся портрета — нити тянутся за пальцем, отпустил — отрываются
  fig.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse") return;
    mouse.x = e.clientX; mouse.y = e.clientY; wake();
  });
  addEventListener("pointermove", (e) => {
    if (e.pointerType === "mouse" || !running) return;
    mouse.x = e.clientX; mouse.y = e.clientY;
  }, { passive: true });
  addEventListener("pointerup", (e) => { if (e.pointerType !== "mouse") { releaseAll(); mouse.x = mouse.y = -1e4; } });
  addEventListener("pointercancel", (e) => { if (e.pointerType !== "mouse") { releaseAll(); mouse.x = mouse.y = -1e4; } });
})();
</script>
</body>
</html>
