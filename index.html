:root {
  --bg: #f2f2f4;
  --fog: #ffffff;
  --ink: #1d1e20;
  --muted: #5f626a;
  --accent: #0071e3;
  --accent-hover: #0062c4;
  --radius-card: 1.25rem;
}

*, *::before, *::after { box-sizing: border-box; }
html, body, h1, h2, h3, p, ul, ol, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img { display: block; max-width: 100%; }

html {
  background: var(--bg);
  color: var(--ink);
  font-family: "Geist Site", ui-sans-serif, system-ui, -apple-system, sans-serif;
  letter-spacing: -0.012em;
  font-size: 100%;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}
body { font-size: 1.0625rem; }

/* Никакой горизонтальной прокрутки ни на одной ширине. */
html, body { overflow-x: hidden; }
.page {
  position: relative;
  overflow-x: hidden;
  overflow-x: clip;
}

@media (prefers-reduced-motion: no-preference) {
  html { scroll-behavior: smooth; }
}

/* Разделы не прячутся под закреплённой шапкой при переходе по ссылке. */
section[id] { scroll-margin-top: 5.5rem; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

/* Туман за страницей: светлые и серые пятна без цвета. Стекло размывает именно их. */
.backdrop {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(48% 42% at 82% 12%, rgb(255 255 255 / 0.95), transparent 70%),
    radial-gradient(40% 36% at 8% 46%, rgb(214 215 220 / 0.7), transparent 70%),
    radial-gradient(46% 40% at 92% 70%, rgb(222 223 228 / 0.65), transparent 70%),
    radial-gradient(52% 44% at 30% 100%, rgb(255 255 255 / 0.9), transparent 70%),
    var(--bg);
}

/* Ночь: тёмный титан — графит с тёплым металлическим отливом. Цвета плавно перетекают. */
html { transition: background-color 1.2s ease, color 1.2s ease; }
.backdrop { transition: opacity 1.2s ease; }
html.night {
  --bg: #1c1b1a;
  --ink: #edebe7;
  --muted: #a8a49d;
  background:
    linear-gradient(115deg, rgba(255, 255, 255, 0.035), transparent 35%, rgba(255, 255, 255, 0.02) 60%, transparent 80%),
    radial-gradient(120% 90% at 50% 0%, #34322f 0%, #232220 45%, #151514 100%) fixed;
  background-attachment: fixed;
}
html.night .backdrop { opacity: 0; }
html.night .glass {
  background: rgba(255, 255, 255, 0.07);
  border-color: rgba(255, 255, 255, 0.14);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 12px 40px rgba(0, 0, 0, 0.35);
}
html.night :is(.candy, .btn, .scroll-down):not(#_) {
  text-shadow: none;
  background:
    radial-gradient(120% 70% at 30% 0%, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0) 60%),
    linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.03));
  box-shadow:
    inset 0 0 0 1px rgba(255, 255, 255, 0.16),
    inset 0 1px 1px rgba(255, 255, 255, 0.35),
    inset 0 -10px 18px -12px rgba(0, 0, 0, 0.4),
    0 12px 30px -16px rgba(0, 0, 0, 0.7);
}
html.night .bar.candy .nav a:not(.btn) { color: rgba(237, 235, 231, 0.78); }
html.night .bar.candy .nav a:not(.btn):hover { background: rgba(255, 255, 255, 0.1); color: var(--ink); }
html.night .bar.candy .menu-button { color: var(--ink); }
html.night .field input, html.night .field textarea { background: rgba(255, 255, 255, 0.06); border-color: rgba(255, 255, 255, 0.16); }
/* Картинка с тенью ночью инвертируется: тень становится лучом света. */
.hero-bg-img { transition: filter 1.2s ease, opacity 1.2s ease; }
html.night .hero-bg-img { opacity: 0; }
/* Из щели расходится треугольник тёплого света: насыщенный в центре,
   к краям бледнеет, а сами края чёткие. */
.slit-beam {
  position: absolute;
  top: var(--slit-y, 26%);
  left: calc(var(--slit-x, 40.75%) - var(--slit-w, 18.5%) * 1.75);
  width: calc(var(--slit-w, 18.5%) * 4.5);
  height: 100%;
  filter: blur(22px);
  mix-blend-mode: screen;
  opacity: 0.55;
  will-change: opacity;     /* «дыхание» света — без перерисовки размытия каждый кадр */
  transition: opacity 1.4s ease;
  pointer-events: none;
}
.slit-beam::before {
  content: "";
  position: absolute;
  inset: 0;
  clip-path: polygon(38.9% 0, 61.1% 0, 100% 100%, 0 100%);
  background:
    radial-gradient(50% 70% at 50% 0%, rgba(255, 196, 120, 0.6), rgba(255, 196, 120, 0) 70%),
    linear-gradient(90deg,
      rgba(255, 240, 220, 0) 0%, rgba(255, 228, 192, 0.155) 14%, rgba(255, 210, 150, 0.35) 30%, rgba(255, 190, 120, 0.57) 42%,
      rgba(255, 170, 92, 0.77) 50%, rgba(255, 190, 120, 0.57) 58%, rgba(255, 210, 150, 0.35) 70%, rgba(255, 228, 192, 0.155) 86%, rgba(255, 240, 220, 0) 100%);
  -webkit-mask-image: linear-gradient(to bottom, #000, rgba(0, 0, 0, 0.65) 40%, transparent 97%);
  mask-image: linear-gradient(to bottom, #000, rgba(0, 0, 0, 0.65) 40%, transparent 97%);
}
html.night .slit-beam { opacity: 0.95; }
.slit-cone, .slit-rays, .slit-flare { display: none; }
/* Курсор над щелью: в этом месте свет разгорается — яркое пятно на линии и луч вниз. */
.slit-hot {
  position: absolute;
  top: calc(var(--slit-y, 26%) - 10px);
  width: var(--slit-w, 18.5%);
  height: 70%;
  background:
    radial-gradient(18% 4% at var(--hot-x, 50%) 3%, rgba(255, 248, 230, 1), rgba(255, 200, 130, 0.6) 45%, transparent 100%),
    radial-gradient(22% 60% at var(--hot-x, 50%) 0%, rgba(255, 186, 104, 0.75), rgba(255, 160, 80, 0.25) 45%, transparent 80%);
  left: var(--slit-x, 40.75%);
  filter: blur(4px);
  mix-blend-mode: screen;
  opacity: var(--hot, 0);
  pointer-events: none;
}
.slit { transition: background-color 1.2s ease, box-shadow 1.2s ease; }
html.night .slit { background: #050505; box-shadow: 0 1px 0 rgba(255, 255, 255, 0.08); }

/* Liquid Glass: бесцветная матовая подложка, светлая обводка, блик сверху и мягкая тень. */
.glass {
  background: rgb(255 255 255 / 0.55);
  -webkit-backdrop-filter: blur(20px) saturate(140%);
  backdrop-filter: blur(20px) saturate(140%);
  border: 1px solid rgb(255 255 255 / 0.7);
  box-shadow:
    inset 0 1px 0 rgb(255 255 255 / 0.8),
    0 8px 32px rgb(29 30 32 / 0.08);
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .glass { background: rgb(255 255 255 / 0.92); }
}

/* Кнопки */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  min-height: 3rem;
  padding: 0 1.5rem;
  border-radius: 999px;
  font-weight: 500;
  white-space: nowrap;
  transition: background-color 150ms, transform 150ms, opacity 150ms;
}
.btn:active { transform: scale(0.98); }
.btn-primary {
  background: var(--accent);
  color: #fff;
  border: 0;
  box-shadow: 0 8px 24px -10px rgb(0 113 227 / 0.6);
}
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:disabled { opacity: 0.6; cursor: progress; }
.btn-primary svg { width: 1.25rem; height: 1.25rem; flex-shrink: 0; }
.btn.glass:hover { background: rgb(255 255 255 / 0.8); }

.wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 1rem;
}

.section { padding: 4rem 0; }
.section-title {
  font-size: clamp(2rem, 4.5vw, 3.5rem);
  line-height: 1.05;
  font-weight: 300;
  letter-spacing: -0.03em;
}
.muted { color: var(--muted); }
.note { margin-top: 1.5rem; }

/* Шапка */
.header {
  position: fixed;
  inset: 0 0 auto;
  z-index: 50;
  padding: 0.75rem 1rem 0;
}
/* Компактная полупрозрачная пилюля сверху по центру, по ширине содержимого. */
.bar {
  width: fit-content;
  min-width: 15rem;
  max-width: 100%;
  height: 3.5rem;
  margin: 0 auto;
  padding: 0 0.25rem 0 1.25rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1.5rem;
  border-radius: 999px;
}
.logo {
  font-size: 1.125rem;
  font-weight: 500;
  letter-spacing: -0.02em;
}
.nav { display: none; align-items: center; gap: 0.25rem; }
.nav a:not(.btn) {
  padding: 0.5rem 1rem;
  border-radius: 999px;
  font-size: 0.9375rem;
  color: rgb(29 30 32 / 0.8);
  transition: background-color 150ms, color 150ms;
}
.nav a:not(.btn):hover { background: rgb(255 255 255 / 0.7); color: var(--ink); }
.nav .btn { margin-left: 0.5rem; }

.menu-button {
  width: 3rem;
  height: 3rem;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
}
.menu-button svg { width: 1.25rem; height: 1.25rem; }

.mobile-menu {
  width: min(100%, 22rem);
  margin: 0.5rem auto 0;
  padding: 0.5rem;
  display: flex;
  flex-direction: column;
  border-radius: 1.75rem;
}
.mobile-menu[hidden] { display: none; }
.mobile-menu a:not(.btn) {
  padding: 0.875rem 1rem;
  border-radius: 1rem;
  font-size: 1.125rem;
}
.mobile-menu a:not(.btn):hover { background: rgb(255 255 255 / 0.7); }
.mobile-menu .btn { margin-top: 0.5rem; width: 100%; }

/* Первый экран: фон hero-bg.jpg на всю ширину окна, текст мелко внизу слева.
   Чёрная линия с тенью нарисована на самой картинке; background-position: center
   держит её ровно посередине экрана на любой ширине. */
.hero {
  position: relative;
  isolation: isolate;
  min-height: 100vh;   /* старые браузеры не знают svh — без этого первый экран другой высоты и щель «уезжает» от тени */
  min-height: 100svh;
  display: block;
  /* Текст стоит прямо под щелью, в её свете. */
  padding: calc(var(--slit-y, 26vh) + clamp(7rem, 22vh, 13rem)) 0 6rem;
}
/* Низ картинки становится прозрачным и растворяется в фоне страницы, без границы. */
/* Фон, линия и свет из щели. Положение линии на картинке скрипт пересчитывает
   в переменные --slit-x, --slit-y, --slit-w при любом размере окна. */
/* Слой со светом выходит ниже первого экрана на --beam-ext, чтобы луч продолжался
   по странице. Картинка остаётся в пределах первого экрана (bottom у .hero-bg-img). */
.hero { --beam-ext: 20vh; }
.hero-bg {
  position: absolute;
  inset: 0 0 calc(var(--beam-ext) * -1) 0;
  z-index: -1;
  overflow: hidden;
  pointer-events: none;
  -webkit-mask-image: linear-gradient(to bottom, #000 62%, transparent 100%);
  mask-image: linear-gradient(to bottom, #000 62%, transparent 100%);
  transform: translate3d(0, calc(var(--hero-p, 0) * 18vh), 0);
  will-change: transform;   /* параллакс двигает готовый слой, а не перерисовывает размытый свет */
}
@property --pour {
  syntax: "<percentage>";
  inherits: false;
  initial-value: 100%;
}
.hero-bg-img {
  position: absolute;
  inset: 0 0 var(--beam-ext) 0;
  background: url("hero-bg.jpg") center / cover no-repeat;
  /* Тень «стекает» сверху вниз: маска открывает картинку до уровня --pour.
     Вторая маска растворяет низ картинки в фоне страницы. */
  -webkit-mask-image: linear-gradient(to bottom, #000 var(--pour), transparent calc(var(--pour) + 25%)), linear-gradient(to bottom, #000 62%, transparent 100%);
  -webkit-mask-composite: source-in;
  mask-image: linear-gradient(to bottom, #000 var(--pour), transparent calc(var(--pour) + 25%)), linear-gradient(to bottom, #000 62%, transparent 100%);
  mask-composite: intersect;
}
/* Тень на картинке на 10% глубже: та же картинка поверх себя в режиме умножения. */
.hero-bg-img::after {
  content: "";
  position: absolute;
  inset: 0;
  background: inherit;
  mix-blend-mode: multiply;
  opacity: 0.18;
}
.slit,
.slit-light,
.slit-cone {
  position: absolute;
  left: var(--slit-x, 40.75%);
  width: var(--slit-w, 18.5%);
  pointer-events: none;
}
/* Линия поверх такой же линии на картинке: нужна, чтобы её «прочертить» при загрузке. */
.slit {
  top: calc(var(--slit-y, 26%) - 1px);
  height: 2px;
  background: #050505;
  border-radius: 2px;
}
/* Тёплый свет, который пробивается из щели, как из-под двери. */
.slit-light {
  top: calc(var(--slit-y, 26%) + 1px);
  height: 22px;
  background: linear-gradient(90deg,
    #ffb45a, #ffd9a0, #fff3dc, #ffc778, #ff9e4a, #ffd9a0, #ffb45a, #ffd9a0) 0 0 / 200% 100%;
  filter: blur(6px);
  -webkit-mask-image: linear-gradient(180deg, #000, transparent), linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent);
  -webkit-mask-composite: source-in;
  mask-image: linear-gradient(180deg, #000, transparent), linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent);
  mask-composite: intersect;
  mix-blend-mode: screen;
  opacity: 1;
}
/* Тонкая яркая кромка света прямо под линией. */
.slit-edge {
  position: absolute;
  left: var(--slit-x, 40.75%);
  width: var(--slit-w, 18.5%);
  top: calc(var(--slit-y, 26%) + 1px);
  height: 2px;
  background: linear-gradient(90deg,
    #ffb45a, #ffd9a0, #fff3dc, #ffc778, #ff9e4a, #ffd9a0, #ffb45a, #ffd9a0) 0 0 / 200% 100%;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
  filter: blur(0.6px);
  mix-blend-mode: screen;
  pointer-events: none;
}
/* Лучи внутри конуса: тонкие светлые полосы, которые медленно сдвигаются. */
.slit-rays {
  position: absolute;
  top: var(--slit-y, 26%);
  left: calc(var(--slit-x, 40.75%) - var(--slit-w, 18.5%) * 0.5);
  width: calc(var(--slit-w, 18.5%) * 2);
  height: 80%;
  background: repeating-linear-gradient(90deg,
    rgba(255, 214, 150, 0) 0 22px, rgba(255, 220, 160, 0.55) 30px, rgba(255, 214, 150, 0) 44px,
    rgba(255, 214, 150, 0) 70px, rgba(255, 236, 200, 0.4) 78px, rgba(255, 214, 150, 0) 96px) 0 0 / 260px 100%;
  -webkit-mask-image: radial-gradient(34% 100% at 50% 0%, #000, transparent 78%);
  mask-image: radial-gradient(34% 100% at 50% 0%, #000, transparent 78%);
  filter: blur(14px);
  mix-blend-mode: screen;
  opacity: 0.45;
  transform: perspective(600px) rotateX(38deg);
  transform-origin: 50% 0;
  pointer-events: none;
}
/* Белый блик, который бегает вдоль щели. */
.slit-flare {
  position: absolute;
  left: var(--slit-x, 40.75%);
  top: calc(var(--slit-y, 26%) - 6px);
  width: calc(var(--slit-w, 18.5%) * 0.22);
  height: 16px;
  background: radial-gradient(50% 50% at 50% 50%, rgba(255, 252, 240, 0.95), rgba(255, 214, 150, 0.45) 40%, transparent 70%);
  filter: blur(2px);
  mix-blend-mode: screen;
  pointer-events: none;
  opacity: 0;
}
/* Тёплый конус света под щелью: рассеивается далеко вниз, внутри едва заметные лучи. */
.slit-cone {
  top: var(--slit-y, 26%);
  height: 90%;
  margin-left: calc(var(--slit-w, 18.5%) * -0.35);
  width: calc(var(--slit-w, 18.5%) * 1.7);
  background: linear-gradient(90deg,
    #ffb45a, #ffd9a0, #fff3dc, #ffc778, #ff9e4a, #ffd9a0, #ffb45a, #ffd9a0) 0 0 / 200% 100%;
  -webkit-mask-image: radial-gradient(40% 100% at 50% 0%, #000, rgba(0, 0, 0, 0.5) 45%, transparent 82%);
  mask-image: radial-gradient(40% 100% at 50% 0%, #000, rgba(0, 0, 0, 0.5) 45%, transparent 82%);
  filter: blur(32px);
  mix-blend-mode: screen;
  opacity: 0.7;
  transform-origin: 50% 0;
}
.hero-text {
  position: relative;
  z-index: 1;
  width: 100%;
  text-align: center;
}
.hero-text .actions { justify-content: center; }
.kicker {
  font-size: 0.9375rem;
  color: var(--muted);
}
.hero h1 {
  position: relative;
  margin: 0.5rem auto 0;
  max-width: 22ch;
  font-size: clamp(2.1rem, 4.4vw, 4rem);
  line-height: 1.05;
  font-weight: 300;
  letter-spacing: -0.035em;
}
.actions {
  margin-top: 2rem;
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
}

.scroll-down {
  position: absolute;
  right: 1rem;
  bottom: 2rem;
  display: flex;
  width: 3rem;
  height: 3rem;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
}
.scroll-down svg { width: 1.25rem; height: 1.25rem; }

/* Кнопки, шапка и стрелка вниз: прозрачное объёмное стекло без цвета.
   Цвет есть только у главной кнопки «Написать в Telegram»: радужная кромка
   и мягкая подсветка, которые медленно переливаются. */
@property --lg-angle {
  syntax: "<angle>";
  inherits: false;
  initial-value: 0deg;
}
:is(.candy, .btn):not(#_) { position: relative; }
:is(.candy, .btn, .scroll-down):not(#_) {
  isolation: isolate;
  border: 0;
  color: var(--ink);
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
  background:
    radial-gradient(120% 70% at 30% 0%, rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0) 60%),
    linear-gradient(180deg, rgba(255, 255, 255, 0.32), rgba(255, 255, 255, 0.08));
  -webkit-backdrop-filter: blur(14px) saturate(180%) brightness(1.04);
  backdrop-filter: blur(14px) saturate(180%) brightness(1.04);
  box-shadow:
    inset 0 0 0 1px rgba(255, 255, 255, 0.55),
    inset 0 1px 1px rgba(255, 255, 255, 0.95),
    inset 0 10px 18px -10px rgba(255, 255, 255, 0.9),
    inset 0 -10px 18px -12px rgba(29, 30, 32, 0.16),
    0 12px 30px -16px rgba(29, 30, 32, 0.35);
  transition: transform 400ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow 400ms ease;
}
.bar.candy:not(#_) { text-shadow: none; }

/* Главная кнопка. */
.prism::before,
.prism::after {
  content: "";
  position: absolute;
  border-radius: inherit;
  background: conic-gradient(from var(--lg-angle),
    #ff8ad8, #a98bff, #6fd6ff, #7dffc7, #ffe58a, #ff9f7a, #ff8ad8);
  pointer-events: none;
}
/* Кромка 1.5px. */
.prism::before {
  inset: 0;
  z-index: 2;
  padding: 1.5px;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  opacity: 0.9;
}
/* Подсветка сзади. */
.prism::after {
  inset: -6px;
  z-index: -1;
  filter: blur(16px);
  opacity: 0.45;
  transition: opacity 200ms;
}

:is(.candy, .btn, .scroll-down) svg { width: 1.25rem; height: 1.25rem; flex-shrink: 0; }
.btn:not(#_):hover, .scroll-down:not(#_):hover {
  transform: translateY(-1px);
  box-shadow:
    inset 0 0 0 1px rgba(255, 255, 255, 0.7),
    inset 0 1px 1px rgba(255, 255, 255, 1),
    inset 0 10px 18px -10px rgba(255, 255, 255, 1),
    inset 0 -10px 18px -12px rgba(29, 30, 32, 0.16),
    0 16px 34px -16px rgba(29, 30, 32, 0.4);
}
.prism:hover::after { opacity: 0.75; }
.btn:not(#_):active { transform: translateY(0) scale(0.98); }
.btn:not(#_):disabled { opacity: 0.6; cursor: progress; }

/* Когда наводишь курсор на кнопку, за ней загорается тот же тёплый свет, что из щели. */
:is(.btn, .scroll-down, .theme-toggle, .menu-button)::after {
  content: "";
  position: absolute;
  inset: -10px;
  z-index: -1;
  border-radius: inherit;
  background: radial-gradient(60% 70% at 50% 60%, rgba(255, 196, 120, 0.95), rgba(255, 158, 74, 0.5) 45%, transparent 75%);
  filter: blur(14px);
  opacity: 0;
  transform: scale(0.85);
  pointer-events: none;
  transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1), transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
}
:is(.btn, .scroll-down, .theme-toggle, .menu-button):is(:hover, :focus-visible)::after {
  opacity: 0.85;
  transform: scale(1.05);
}
.menu-button, .theme-toggle { position: relative; isolation: isolate; }

/* Переключатель дня и ночи: маленькая стеклянная пилюля в шапке. */
.theme-toggle {
  flex-shrink: 0;
  width: 3.25rem;
  height: 2rem;
  padding: 0;
  border: 0;
  border-radius: 999px;
  background: rgba(29, 30, 32, 0.08);
  box-shadow: inset 0 1px 2px rgba(29, 30, 32, 0.12), inset 0 0 0 1px rgba(255, 255, 255, 0.5);
  transition: background-color 0.8s ease;
}
.theme-toggle .knob {
  position: absolute;
  top: 3px;
  left: 3px;
  width: calc(2rem - 6px);
  height: calc(2rem - 6px);
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: radial-gradient(120% 90% at 30% 15%, #fff, #f1f1f3);
  box-shadow: 0 2px 6px rgba(29, 30, 32, 0.25), inset 0 -1px 2px rgba(29, 30, 32, 0.08);
  transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1), background 0.8s ease;
}
.theme-toggle svg { width: 0.875rem; height: 0.875rem; }
.theme-toggle .moon { display: none; }
.night .theme-toggle { background: rgba(255, 255, 255, 0.14); box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(255, 255, 255, 0.12); }
.night .theme-toggle .knob { transform: translateX(1.25rem); background: radial-gradient(120% 90% at 30% 15%, #f4f1ec, #bdb8af); }
.night .theme-toggle .sun { display: none; }
.night .theme-toggle .moon { display: block; }
.theme-toggle:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }

/* Ссылки внутри шапки. */
.bar.candy .nav a:not(.btn) { color: rgba(29, 30, 32, 0.8); }
.bar.candy .nav a:not(.btn):hover { background: rgba(255, 255, 255, 0.5); color: var(--ink); }
.bar.candy .menu-button { background: none; border: 0; color: var(--ink); }

@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  :is(.candy, .btn, .scroll-down):not(#_) { background-color: rgba(255, 255, 255, 0.85); }
}

/* Обо мне */
.about {
  display: grid;
  gap: 2rem;
}
.about-head {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2rem;
}
.avatar {
  width: 6rem;
  height: 6rem;
  flex-shrink: 0;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-size: 2.25rem;
  font-weight: 300;
}
/* Портрет из тонких нитей: линии рисует скрипт по яркости фото.
   В голове поверх загораются нейронные связи. */
.portrait {
  position: relative;
  width: min(100%, 24rem);
  margin: 0;
  aspect-ratio: 300 / 305;
}
.portrait canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
.about-text { max-width: 60ch; color: var(--muted); }
.about-text p + p { margin-top: 1.1rem; }
/* Описания: тихий, ровный текст без лишнего веса. */
.about-text, .lead, .card p, .steps p, .note {
  font-weight: 400;
  line-height: 1.6;
  letter-spacing: -0.006em;
}

/* Карточки: услуги и работы */
.cards {
  margin-top: 2.5rem;
  display: grid;
  gap: 1rem;
}
.card {
  display: flex;
  flex-direction: column;
  padding: 1.75rem;
  border-radius: var(--radius-card);
  transition: transform 200ms, box-shadow 200ms;
}
.card:hover {
  transform: translateY(-2px);
  box-shadow:
    inset 0 1px 0 rgb(255 255 255 / 0.8),
    0 14px 36px rgb(29 30 32 / 0.1);
}
.card h3 {
  font-size: 1.25rem;
  font-weight: 500;
  letter-spacing: -0.02em;
}
.card .desc { margin-top: 0.5rem; }
.price {
  margin-top: auto;
  padding-top: 2rem;
  font-size: 2rem;
  line-height: 1;
  font-weight: 300;
  letter-spacing: -0.03em;
  white-space: nowrap;
}
.work img {
  margin: -1.75rem -1.75rem 1.5rem;
  width: calc(100% + 3.5rem);
  max-width: none;
  aspect-ratio: 16 / 10;
  object-fit: cover;
  border-radius: var(--radius-card) var(--radius-card) 0 0;
}
.work-link {
  margin-top: 1.25rem;
  align-self: flex-start;
  font-weight: 500;
  color: var(--accent);
  text-underline-offset: 4px;
}
.work-link:hover { text-decoration: underline; }
.work-empty {
  min-height: 13rem;
  justify-content: space-between;
  gap: 1.5rem;
}
.work-empty h3 { font-weight: 400; color: var(--muted); }
.work-empty .btn { align-self: flex-start; }

/* Как я работаю */
.steps {
  margin-top: 2.5rem;
  display: grid;
  gap: 2rem;
}
.step-number {
  display: block;
  font-size: 3.5rem;
  line-height: 1;
  font-weight: 300;
  letter-spacing: -0.04em;
  color: var(--muted);
}
.step h3 {
  margin-top: 1rem;
  font-size: 1.25rem;
  font-weight: 500;
  letter-spacing: -0.02em;
}
.step p { margin-top: 0.375rem; max-width: 32ch; }

/* Контакты */
.contacts-panel {
  padding: 2.5rem 1.5rem;
  border-radius: 2rem;
}
.contacts-panel .lead {
  margin-top: 1rem;
  max-width: 34rem;
  font-size: 1.125rem;
}
.form-toggle {
  margin-top: 1.25rem;
  padding: 0.25rem 0;
  border: 0;
  background: none;
  font-size: 0.9375rem;
  color: var(--muted);
  text-decoration: underline;
  text-underline-offset: 4px;
}
.form-toggle:hover { color: var(--ink); }
.form-toggle[hidden] { display: none; }

.form {
  margin-top: 1.5rem;
  max-width: 34rem;
  display: grid;
  gap: 1rem;
}
.form[hidden] { display: none; }
.field { display: grid; gap: 0.375rem; }
.field label { font-size: 0.9375rem; font-weight: 500; }
.field .optional { font-weight: 400; color: var(--muted); }
.field input,
.field textarea {
  width: 100%;
  min-height: 3rem;
  padding: 0.75rem 1rem;
  border: 1px solid rgb(29 30 32 / 0.14);
  border-radius: 0.875rem;
  background: rgb(255 255 255 / 0.75);
  transition: border-color 150ms;
}
.field textarea { resize: vertical; min-height: 6rem; }
.field input:focus-visible,
.field textarea:focus-visible { border-color: var(--accent); outline-offset: 0; }
.form .btn { justify-self: start; margin-top: 0.25rem; }
.form-done { margin-top: 1.5rem; font-size: 1.125rem; }
.form-done[hidden] { display: none; }

/* Подвал */
.footer {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 0.5rem 1.5rem;
  padding: 1.5rem 0 2.5rem;
  font-size: 0.9375rem;
}
.footer a:hover { color: var(--accent); }

/* Окна мягко покачиваются, пока на них наведён курсор. */
@keyframes sway {
  0%, 100% { rotate: 0deg; translate: 0 -3px; }
  25% { rotate: -0.45deg; translate: -1px -5px; }
  75% { rotate: 0.45deg; translate: 1px -4px; }
}
@media (prefers-reduced-motion: no-preference) and (hover: hover) {
  .card, .contacts-panel { transition: translate 0.6s cubic-bezier(0.22, 1, 0.36, 1), rotate 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
  .card:hover, .contacts-panel:hover { animation: sway 3.2s ease-in-out infinite; }
}

/* Анимации. Если в системе включено «уменьшение движения», их нет. */
@media (prefers-reduced-motion: no-preference) {
  /* Загрузка, один раз и коротко: прочерчивается линия, стекает тень, загорается свет.
     Текст и кнопки появляются уже через 0,6 с, не дожидаясь света: посетитель
     должен сразу видеть, кто это и куда нажать. */
  .slit { animation: slit-draw 0.9s cubic-bezier(0.65, 0, 0.35, 1) 0.1s both; }
  .hero-bg-img { animation: shadow-pour 1.6s cubic-bezier(0.22, 1, 0.36, 1) 0.5s both; }
  .slit-light { animation: light-in 1.4s ease 0.9s both, light-flow 18s linear 0.9s infinite, light-breathe 9s ease-in-out 2.3s infinite; }
  .slit-edge { animation: light-in 1.2s ease 0.8s both, light-flow 18s linear 0.8s infinite; }
  .slit-beam { animation: beam-in 1.8s ease 0.9s both, beam-breathe 10s ease-in-out 2.7s infinite; }

  .hero-text > * { animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) both; animation-delay: 0.6s; }
  .hero-text > :nth-child(2) { animation-delay: 0.7s; }
  .hero-text > :nth-child(3) { animation-delay: 0.8s; }
  .hero-text > :nth-child(4) { animation-delay: 0.9s; }
  .hero-text { transform: translate3d(0, calc(var(--hero-p, 0) * -6vh), 0); }
  /* При прокрутке тает всё, кроме главной чёрной кнопки: она остаётся чёрной. */
  .hero-text > :not(.actions), .hero-text .actions > :not(.sab-btn) { opacity: calc(1 - var(--hero-p, 0) * 1.4); }

  /* Главная кнопка: кромка и подсветка медленно переливаются. */
  .prism::before, .prism::after { animation: lg-spin 8s linear infinite; }

  /* Заголовки разделов выезжают из-под невидимой кромки, как на augen.pro. */
  .js .reveal .section-title {
    transition: clip-path 1.4s cubic-bezier(0.22, 1, 0.36, 1), transform 1.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .js .reveal:not(.is-visible) .section-title {
    clip-path: inset(0 0 100% 0);
    transform: translateY(0.6em);
  }
  /* Карточки и шаги появляются по очереди. */
  .js .reveal :is(.cards, .steps) > * {
    transition: opacity 1.2s ease, transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .js .reveal:not(.is-visible) :is(.cards, .steps) > * { opacity: 0; transform: translateY(24px); }
  .js .reveal :is(.cards, .steps) > :nth-child(1) { transition-delay: 0.2s; }
  .js .reveal :is(.cards, .steps) > :nth-child(2) { transition-delay: 0.38s; }
  .js .reveal :is(.cards, .steps) > :nth-child(3) { transition-delay: 0.56s; }
  .js .reveal :is(.cards, .steps) > :nth-child(4) { transition-delay: 0.74s; }

  /* Разделы проявляются один раз при прокрутке. Класс js ставит скрипт. */
  .js .reveal { transition: opacity 1.2s ease, transform 1.2s cubic-bezier(0.22, 1, 0.36, 1); }
  .js .reveal:not(.is-visible) { opacity: 0; transform: translateY(16px); }
}

/* ================================================================
   Шлифовка: типографика, сетка и ритм.
   Всё лежит на одной сетке 4/8: слева заголовок раздела, справа содержание.
   ================================================================ */
:root {
  --bg: #f3f3f1;
  --ink: #19191b;
  --muted: #5b5a57;
  --hair: rgba(25, 25, 27, 0.12);
  --step--1: 0.875rem;
  --step-0: 1.0625rem;
  --step-1: 1.25rem;
  --step-2: clamp(1.375rem, 1.1rem + 0.9vw, 1.75rem);
  --step-4: clamp(2.5rem, 1.6rem + 3.6vw, 4.5rem);
}
html.night { --hair: rgba(237, 235, 231, 0.13); --muted: #a9a59e; }
body { font-size: var(--step-0); }
@media (min-width: 1024px) { body { font-size: 1.125rem; } }
::selection { background: rgba(255, 180, 100, 0.35); }

/* Первый экран */
.hero h1 {
  font-size: clamp(2.375rem, 1.2rem + 4.4vw, 4.75rem);
  letter-spacing: -0.045em;
  line-height: 1;
  max-width: 18ch;
  text-wrap: balance;
}
.hero-sub {
  margin: 1.25rem auto 0;
  max-width: 34ch;
  font-size: var(--step-1);
  line-height: 1.4;
  color: var(--muted);
  letter-spacing: -0.015em;
  text-wrap: balance;
}
.hero-text .actions { margin-top: 2.25rem; }

/* Разделы */
.section { padding: 5.5rem 0; }
.section-title {
  font-size: var(--step-4);
  line-height: 1;
  letter-spacing: -0.045em;
  font-weight: 300;
  text-wrap: balance;
}
@media (min-width: 1024px) {
  .section { padding: 8.5rem 0; }
  .split {
    display: grid;
    grid-template-columns: minmax(0, 4fr) minmax(0, 8fr);
    column-gap: 4rem;
    align-items: start;
  }
  .split > .section-title { position: sticky; top: 7rem; }
  .split > :not(.section-title) { grid-column: 2; }
  .split > .services, .split > .works, .split > .steps { margin-top: 0; }
  .about { grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); column-gap: 4rem; }
  .about-text { padding-top: 0.75rem; }
}

/* Обо мне */
.about-text { max-width: 36rem; color: var(--muted); font-size: var(--step-0); line-height: 1.65; }
@media (min-width: 1024px) { .about-text { font-size: 1.125rem; } }
.about-text .about-lead {
  font-size: var(--step-2);
  line-height: 1.35;
  letter-spacing: -0.025em;
  color: var(--ink);
  text-wrap: pretty;
}
.about-text p + p { margin-top: 1.25rem; }

/* Услуги: список с тонкими линиями, как меню хорошего места. */
.services { margin-top: 2.5rem; border-bottom: 1px solid var(--hair); }
.service {
  position: relative;
  display: grid;
  gap: 0.5rem 2rem;
  padding: 1.75rem 0;
  border-top: 1px solid var(--hair);
}
.service-title { font-size: var(--step-1); font-weight: 500; letter-spacing: -0.02em; line-height: 1.3; }
.service-desc { color: var(--muted); line-height: 1.6; max-width: 34ch; }
.service .price {
  margin: 0.5rem 0 0;
  padding: 0;
  font-size: var(--step-2);
  font-weight: 300;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
/* Строка под курсором: слева тёплая нить света, название чуть сдвигается. */
.service::before {
  content: "";
  position: absolute;
  left: 0;
  top: -1px;
  height: 1px;
  width: 100%;
  background: linear-gradient(90deg, rgba(255, 170, 92, 0.9), rgba(255, 210, 150, 0.4) 40%, transparent);
  transform: scaleX(0);
  transform-origin: 0 50%;
  transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
}
.service:hover::before { transform: scaleX(1); }
.service-title { transition: translate 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
.service:hover .service-title { translate: 0.375rem 0; }
@media (min-width: 768px) {
  .service { grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr) 10.5rem; align-items: baseline; padding: 2.25rem 0; }
  .service .price { margin: 0; text-align: right; }
}
.note { margin-top: 1.25rem; font-size: var(--step--1); color: var(--muted); }

/* Работы */
.works { margin-top: 2.5rem; display: grid; gap: 1rem; }
.work-feature { padding: 0; overflow: hidden; display: grid; }
.work-text { padding: 1.75rem; }
.work-feature h3 { font-size: var(--step-1); font-weight: 500; letter-spacing: -0.02em; }
.work-feature .desc { margin-top: 0.5rem; color: var(--muted); max-width: 36ch; line-height: 1.6; }
/* Миниатюра первого экрана: щель и тёплый треугольник света на тёмном титане. */
.work-preview {
  position: relative;
  min-height: 13rem;
  background: radial-gradient(120% 90% at 50% 0%, #34322f, #1d1c1b 60%, #151514);
}
.work-preview::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 28%;
  width: 26%;
  height: 2px;
  translate: -50% 0;
  border-radius: 2px;
  background: #ffe8c2;
  box-shadow: 0 0 10px rgba(255, 200, 130, 0.9);
}
.work-preview::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 28%;
  width: 70%;
  height: 72%;
  translate: -50% 0;
  clip-path: polygon(31% 0, 69% 0, 100% 100%, 0 100%);
  background: linear-gradient(90deg, transparent, rgba(255, 196, 120, 0.35) 35%, rgba(255, 180, 100, 0.6) 50%, rgba(255, 196, 120, 0.35) 65%, transparent);
  -webkit-mask-image: linear-gradient(#000, transparent);
  mask-image: linear-gradient(#000, transparent);
  filter: blur(8px);
}
@media (min-width: 768px) {
  .work-feature { grid-template-columns: 1.1fr 1fr; }
  .work-preview { order: 2; min-height: 15rem; }
  .work-text { padding: 2.25rem; display: flex; flex-direction: column; justify-content: flex-end; }
}
.work-invite {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 1rem 1.5rem;
  padding: 1.5rem 1.75rem;
  border: 1px dashed var(--hair);
  border-radius: var(--radius-card);
}
.work-invite-text { color: var(--muted); }

/* Как я работаю: четыре шага, у каждого тонкая линия сверху. */
.steps { margin-top: 2.5rem; gap: 2.25rem 2.5rem; }
.step { padding-top: 1.25rem; border-top: 1px solid var(--hair); }
.step-number {
  font-size: var(--step--1);
  font-weight: 500;
  letter-spacing: 0.02em;
  font-variant-numeric: tabular-nums;
  color: #b9773a;
}
html.night .step-number { color: #e9b276; }
.step h3 { margin-top: 0.875rem; font-size: var(--step-1); }
.step p { margin-top: 0.5rem; color: var(--muted); line-height: 1.6; }
@media (min-width: 640px) { .steps { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1024px) { .steps { grid-template-columns: repeat(2, 1fr); } }

/* Контакты */
.contacts-panel .section-title { max-width: 14ch; }
.contacts-panel .lead { font-size: var(--step-1); line-height: 1.5; color: var(--muted); max-width: 32ch; }
@media (min-width: 1024px) { .contacts-panel { padding: 5rem 4.5rem; } }

/* Подвал */
.footer { padding-top: 2.5rem; border-top: 1px solid var(--hair); font-size: var(--step--1); }

/* Фокус с клавиатуры виден везде. */
:focus-visible { outline: 2px solid #d08a44; outline-offset: 3px; border-radius: 6px; }

/* Заголовок первого экрана: внизу слева, тёмный и тонкий, без теней. */
.hero {
  display: flex;
  align-items: flex-end;
  padding: 7rem 0 3rem;
}
.hero-text { text-align: left; }
.hero-text .actions { justify-content: flex-start; margin-top: 2rem; }
.hero h1 {
  margin: 0;
  max-width: 20ch;
  font-size: clamp(2.25rem, 1.5rem + 2.2vw, 3.25rem);
  line-height: 1.05;
  font-weight: 300;
  letter-spacing: -0.04em;
  color: var(--ink);
  text-shadow: none;
}
.hero-sub {
  margin: 0.875rem 0 0;
  max-width: 36ch;
  font-size: var(--step-0);
  font-weight: 400;
  color: var(--muted);
  text-shadow: none;
  text-wrap: pretty;
}
@media (min-width: 640px) { .hero { padding-bottom: 3.5rem; } }

/* Instagram: запасной канал связи — тихая ссылка в контактах и в подвале. */
.footer-links { display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; }
.footer a:hover, .contact-alt a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
.contact-alt { margin-top: 1rem; color: var(--muted); }
.contact-alt a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--hair); text-underline-offset: 4px; }

/* ===== Кнопка с липкими нитями (Sticky Arm Button) ===== */
/* ==========================================================
   Sticky Arm Button — кнопка, из которой к курсору тянется
   «рука» из чёрных нитей с нарисованной кистью.
   Подключение: этот CSS + sticky-arm-button.js,
   кнопке — класс .sab-btn и атрибут data-sticky-arm.
   ========================================================== */

.sab-btn {
  position: relative;
  isolation: isolate;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 66px;
  padding: 0 40px;
  border: 0;
  border-radius: 999px;
  overflow: hidden;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;   /* без превью ссылки при долгом нажатии (iOS) */
  -webkit-user-select: none;
  user-select: none;
  touch-action: none;            /* палец тянет нити, а не прокручивает страницу */

  font: 700 22px/1 "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif;
  letter-spacing: -0.035em;
  color: #f3f3f3;
  text-shadow: 0 1px 1px rgba(0, 0, 0, .7);
  white-space: nowrap;
  text-decoration: none;
  box-sizing: border-box;

  /* чёрный лак: светлее сверху, глубокий низ, отражение окна в левом торце */
  background:
    radial-gradient(34px 24px at 14% 46%, rgba(255,255,255,.30), rgba(255,255,255,0) 72%),
    linear-gradient(180deg, #2b2b2e 0%, #0d0d0e 40%, #050505 72%, #161618 100%);
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,.38),       /* верхняя кромка */
    inset 0 -1px 0 rgba(255,255,255,.12),         /* нижняя кромка */
    inset 0 -12px 16px -8px rgba(0,0,0,.95),      /* глубина снизу */
    inset 7px 0 10px -7px rgba(255,255,255,.22),  /* левый торец */
    inset -6px 0 10px -7px rgba(255,255,255,.12), /* правый торец */
    0 2px 3px rgba(20,15,35,.35),                 /* контактная тень */
    0 14px 22px -8px rgba(40,30,70,.42),          /* мягкая тень — кнопка приподнята */
    0 30px 50px -22px rgba(40,30,70,.35);
}

/* широкий мягкий блик в верхней половине */
.sab-btn::before {
  content: "";
  position: absolute;
  left: 6%; right: 9%; top: 4px; height: 42%;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,0));
  pointer-events: none;
  z-index: -1;
}

/* вертикальное отражение у левого торца */
.sab-btn::after {
  content: "";
  position: absolute;
  left: 9px; top: 11px; bottom: 13px; width: 13px;
  border-radius: 999px;
  background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.32), rgba(255,255,255,0));
  filter: blur(1.5px);
  pointer-events: none;
  z-index: -1;
}

.sab-btn:focus-visible {
  outline: 3px solid #7d93ff;
  outline-offset: 4px;
}

/* холст с нитями — служебный элемент, создаётся скриптом */
.sab-canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 2147482998;
}


/* --- Подгонка кнопки под сайт: шрифт сайта, высота рядом с соседней кнопкой --- */
.sab-btn {
  height: 3.5rem;
  padding: 0 1.75rem;
  gap: 0.5rem;
  font-family: inherit;
  font-weight: 500;
  font-size: 1.0625rem;
  letter-spacing: -0.01em;
}
.sab-btn svg { width: 1.25rem; height: 1.25rem; flex-shrink: 0; position: relative; }
.actions:has(.sab-btn) { align-items: center; }
.hero-off :is(.slit-light, .slit-edge, .slit-beam, .hero-bg-img) { animation-play-state: paused; }
html.night .sab-btn { --sab-strand: #d6d2cb; --sab-strand-hl: rgba(0,0,0,.22); }   /* ночью чёрные нити не видны на тёмном фоне */
</style>

// Первый экран: где на картинке лежит линия (доли ширины и высоты картинки hero-bg.jpg).
// Картинка растянута по cover и выровнена по центру, поэтому пересчитываем под размер окна.
const SLIT = { imageW: 2576, imageH: 1449, left: 0.4075, width: 0.185, top: 0.2595 };
const heroSection = document.querySelector(".hero");
const heroBg = document.querySelector(".hero-bg");
const heroBgImg = document.querySelector(".hero-bg-img");
function placeSlit() {
  const w = heroBgImg.clientWidth;
  const h = heroBgImg.clientHeight;
  const scale = Math.max(w / SLIT.imageW, h / SLIT.imageH);
  const offsetX = (w - SLIT.imageW * scale) / 2;
  const offsetY = (h - SLIT.imageH * scale) / 2;
  heroBg.style.setProperty("--slit-x", `${offsetX + SLIT.left * SLIT.imageW * scale}px`);
  heroBg.style.setProperty("--slit-w", `${SLIT.width * SLIT.imageW * scale}px`);
  heroBg.style.setProperty("--slit-y", `${offsetY + SLIT.top * SLIT.imageH * scale}px`);
  heroSection.style.setProperty("--slit-y", `${offsetY + SLIT.top * SLIT.imageH * scale}px`);
}
placeSlit();
window.addEventListener("resize", placeSlit);
// Высота первого экрана может измениться и после загрузки (шрифт, старый браузер) —
// тогда линия со светом пересчитывается вслед за картинкой и не отрывается от неё.
if ("ResizeObserver" in window) new ResizeObserver(() => placeSlit()).observe(heroBgImg);
window.addEventListener("load", placeSlit);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeSlit);
// Бесконечные анимации света ставятся на паузу, когда первый экран не виден.
if ("IntersectionObserver" in window) {
  new IntersectionObserver(([e]) => document.documentElement.classList.toggle("hero-off", !e.isIntersecting))

}

// Прокрутка: фон первого экрана уходит медленнее страницы, текст растворяется.
const calm = window.matchMedia("(prefers-reduced-motion: reduce)");
let ticking = false;
let heroP = 0;
function onScroll() {
  ticking = false;
  if (calm.matches) return;
  const heroH = heroSection.offsetHeight || 1;
  const p = Math.min(Math.max(window.scrollY / heroH, 0), 1);
  heroP += (p - heroP) * 0.18;
  heroSection.style.setProperty("--hero-p", heroP.toFixed(4));
  if (Math.abs(p - heroP) > 0.0005) { ticking = true; requestAnimationFrame(onScroll); }
}
window.addEventListener("scroll", () => {
  if (!ticking) { ticking = true; requestAnimationFrame(onScroll); }
}, { passive: true });

  if (remember) {

  }
}

const portraitBytes = Uint8Array.from(atob(PORTRAIT.data), (c) => c.charCodeAt(0));
const threadsCanvas = document.querySelector(".threads");
const lifeCanvas = document.querySelector(".neurons");

// Плавная выборка между соседними точками сетки: линии выходят мягче и детальнее.
function sample(gx, gy) {
  const x = Math.min(PORTRAIT.w - 1.001, Math.max(0, gx));
  const y = Math.min(PORTRAIT.h - 1.001, Math.max(0, gy));
  const x0 = Math.floor(x), y0 = Math.floor(y), fx = x - x0, fy = y - y0;
  const at = (xx, yy, k) => portraitBytes[(yy * PORTRAIT.w + xx) * 2 + k] / 255;
  const mix = (k) =>
    (at(x0, y0, k) * (1 - fx) + at(x0 + 1, y0, k) * fx) * (1 - fy) +
    (at(x0, y0 + 1, k) * (1 - fx) + at(x0 + 1, y0 + 1, k) * fx) * fy;
  return [mix(0), mix(1)];
}

function fitCanvas(canvas) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.max(1, Math.round(rect.width * dpr));
  canvas.height = Math.max(1, Math.round(rect.height * dpr));
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w: rect.width, h: rect.height };
}

const isNight = () => document.documentElement.classList.contains("night");

// Нити рисуются один раз в скрытый холст; на экран он выводится каждый кадр
// полосками со смещением — так портрет «дышит», кивает и шевелит волосами.
const threadsImage = document.createElement("canvas");

function drawThreads() {
  threadsView = fitCanvas(threadsCanvas);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  threadsImage.width = threadsCanvas.width;
  threadsImage.height = threadsCanvas.height;
  const ctx = threadsImage.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const w = threadsView.w, h = threadsView.h;
  const night = isNight();
  const ink = night ? "237, 235, 231" : "10, 10, 12";   // днём линии почти чёрные
  const scale = w / PORTRAIT.w;
  const rows = Math.round(h / 2.1);               // нити через ~2 px
  const gap = h / rows;
  ctx.clearRect(0, 0, w, h);
  ctx.lineWidth = night ? 0.42 : 0.52;
  ctx.lineCap = "round";
  // Нити группируются по прозрачности: так рисуется быстрее.
  const buckets = Array.from({ length: 12 }, () => new Path2D());
  for (let r = 0; r < rows; r++) {
    const baseY = (r + 0.5) * gap;
    let phase = r * 1.7;
    let prev = null;
    for (let x = 0; x <= w; x += 0.6) {
      const [lum, alpha] = sample(x / scale, baseY / scale);
      if (alpha < 0.15) { prev = null; continue; }
      // Днём нити рисуют тени, ночью свет.
      // днём контраст выше: тёмные места темнее, светлые остаются светлыми
      const tone = night ? Math.pow(lum, 1.05) : Math.min(1, Math.max(0, 0.5 + (Math.pow(1 - lum, 1.05) - 0.5) * 1.4));
      phase += (0.16 + tone * 1.35) * 0.6;
      const y = baseY + Math.sin(phase) * gap * 0.55 * (0.1 + tone * 0.9);
      if (prev) {
        const level = Math.min(11, Math.floor(alpha * (0.08 + tone * 0.92) * 12));
        buckets[level].moveTo(prev[0], prev[1]);
        buckets[level].lineTo(x, y);
      }
      prev = [x, y];
    }
  }
  buckets.forEach((path, level) => {
    ctx.strokeStyle = `rgba(${ink}, ${((level + 0.5) / 12).toFixed(3)})`;
    ctx.stroke(path);
  });
  warpThreads(lastTime);
}

// ---------------------------------------------------------------
// Живое движение: дыхание грудной клетки, лёгкий кивок головы, волосы.
// Возвращает смещение (в px) точки портрета с координатами в долях.
// ---------------------------------------------------------------
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
function lifeMotion(nx, ny, time, w) {
  if (calm.matches) return [0, 0];
  const k = w / 380;                                          // масштаб к размеру портрета
  const t = time / 1000;
  // Дыхание: вдох длиннее выдоха, около 13 вдохов в минуту.
  const phase = (t % 4.6) / 4.6;
  const breath = phase < 0.42 ? smooth(0, 0.42, phase) : 1 - smooth(0.42, 1, phase);
  const chest = smooth(0.5, 0.78, ny);
  let dx = 0.6 * breath * chest * k;                          // грудь чуть вперёд
  let dy = -2.2 * breath * chest * k;                         // и вверх
  // Голова: медленный кивок вверх-вниз, поворот вокруг шеи.
  const head = 1 - smooth(0.4, 0.6, ny);
  const nod = Math.sin(t * (2 * Math.PI / 7.2)) * 0.7 + Math.sin(t * (2 * Math.PI / 3.1)) * 0.3;
  const lever = Math.max(0, 0.6 - ny) / 0.6;                  // чем выше от шеи, тем сильнее
  dy += (1.8 * nod * head - 0.9 * breath) * k * (0.4 + lever);
  dx += 1.1 * nod * head * lever * k;
  // Волосы: отлетевшая прядь у лица и макушка шевелятся, как от лёгкого воздуха.
  const strand = smooth(0.89, 0.95, nx) * (1 - smooth(0.38, 0.5, ny)) * head;
  const crown = 1 - smooth(0.04, 0.16, ny);
  dx += (Math.sin(t * 2.1 + ny * 22) * 1.8 + Math.sin(t * 3.3 + ny * 40) * 0.6) * strand * k;
  dy += Math.sin(t * 1.6 + nx * 10) * 0.8 * strand * k;
  dx += Math.sin(t * 1.4 + ny * 30) * 0.7 * crown * k;
  return [dx, dy];
}
let lastTime = 0;
function warpThreads(time) {
  const { ctx, w, h } = threadsView;
  if (!threadsImage.width) return;
  const dpr = threadsImage.width / w;
  ctx.clearRect(0, 0, w, h);
  const strip = 3;                                            // высота полоски, px
  for (let y = 0; y < h; y += strip) {
    const ny = (y + strip / 2) / h;
    // Тело и лицо двигаются целой строкой; только отлетевшая прядь у лица
    // (правее 0,89, за кончиком носа) режется на узкие кусочки, чтобы колыхаться отдельно.
    const left = ny < 0.52 ? 0.89 : 1;
    const [dx, dy] = lifeMotion(0.4, ny, time, w);
    ctx.drawImage(threadsImage, 0, y * dpr, left * w * dpr, strip * dpr, dx, y + dy, left * w, strip);
    if (left < 1) {
      const cols = 8;
      for (let c = 0; c < cols; c++) {
        const x0 = left + ((1 - left) * c) / cols, x1 = left + ((1 - left) * (c + 1)) / cols;
        const [cx, cy] = lifeMotion((x0 + x1) / 2, ny, time, w);
        ctx.drawImage(threadsImage, x0 * w * dpr, y * dpr, (x1 - x0) * w * dpr, strip * dpr, x0 * w + cx, y + cy, (x1 - x0) * w, strip);
      }
    }
  }
}

// Нейроны в голове, сердце в груди и импульс от сердца к мозгу.
// Без курсора всё живёт само; под курсором загорается ярче.

let neurons = [];
let synapses = [];
let pulses = [];
function buildNeurons() {
  const b = PORTRAIT.brain;
  neurons = [];
  let guard = 0;
  while (neurons.length < 52 && guard++ < 8000) {
    const nx = b.cx + (Math.random() * 2 - 1) * b.rx;
    const ny = b.cy + (Math.random() * 2 - 1) * b.ry;
    if (((nx - b.cx) / b.rx) ** 2 + ((ny - b.cy) / b.ry) ** 2 > 1) continue;
    if (sample(nx * PORTRAIT.w, ny * PORTRAIT.h)[1] < 0.6) continue;
    if (neurons.some((n) => Math.hypot(n.x - nx, n.y - ny) < 0.024)) continue;
    neurons.push({ x: nx, y: ny, ox: nx, oy: ny, seed: Math.random() * 100, glow: 0, red: 0 });
